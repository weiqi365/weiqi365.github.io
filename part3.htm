<h1 align="center" style="line-height: 200%"><!--mstheme--><font color="#660033"><font face="楷体_GB2312">第三部   
玄玄棋经</font><!--mstheme--></font></h1> 
<div align="center">
  <center>
  <!--mstheme--></font><table border="1" width="90%" cellpadding="7" bordercolordark="#003366" bordercolorlight="#003366">
    <tr>
      <td width="100%"><!--mstheme--><font face="宋体"><p align="left" style="line-height: 200%; margin-bottom: -16"><font size="4" face="楷体_GB2312"><b>&nbsp;&nbsp;&nbsp;     
        <font color="#0000FF">《玄玄棋经》</font></b>是中国卢陵（今江西九江）名手晏天章和严德甫共同编著的，约成书于1394年（元至正9年），距今已有600余年。</font></p>  
        <p align="left" style="line-height: 200%"><font face="楷体_GB2312" size="4">&nbsp;&nbsp;&nbsp;     
        该书内容有史论、棋经十三篇、围棋十诀、术语三十二条等，除此之外就是定式、实战谱和死活题376题。其中价值最高的当推死活题。中国的《官子谱》和日本的《棋经众妙》，都把<b><font color="#0000FF">《玄玄棋经》</font></b>的死活题或原封不动，或稍事修改，而加以收集。</font></p>  
      <!--mstheme--></font></td>  
    </tr>  
  </table><!--mstheme--><font face="宋体">
