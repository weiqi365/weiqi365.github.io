<html>  <head> <meta http-equiv="Content-Type" content="text/html; charset=gb2312"> <meta name="GENERATOR" content="Microsoft FrontPage 4.0"> <meta name="ProgId" content="FrontPage.Editor.Document"> <title>第五部 棋经众妙</title> <link rel="stylesheet" type="text/css" href="weiqi365.css"> <meta name="Microsoft Theme" content="-1 0111, default"> </head>  <body background="_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体">  <h1 align="center" style="line-height: 200%"><!--mstheme--><font color="#660033"><font face="楷体_GB2312">第五部    棋经众妙</font><!--mstheme--></font></h1> <div align="center">   <center>   <!--mstheme--></font><table border="1" width="90%" cellpadding="7" bordercolordark="#003366" bordercolorlight="#003366">     <tr>       <td width="100%"><!--mstheme--><font face="宋体"><p align="left" style="line-height: 200%; margin-bottom: -16"><font size="4" face="楷体_GB2312"><b>&nbsp;&nbsp;&nbsp;                  <font color="#0000FF">《棋经众妙》</font></b>为林家11世元美所著。元美本姓舟桥，1778年生。和本因坊元丈、中野知得等是同时代人。本书出版于1812年。</font></p>           <p align="left" style="line-height: 200%; margin-bottom: -16"><font face="楷体_GB2312" size="4">&nbsp;&nbsp;&nbsp;           其内容全部为死活题，而且都比较简明易解。在对<b><font color="#0000FF">《玄玄棋经》</font></b>和<font color="#0000FF"><b>《官子谱》</b></font>中的若干死活题，稍事修改，使之变得较易解的条件下，该书也作了收录。<font color="#0000FF"><b>《发阳论》</b></font>中的死活题，也收录了一些。</font></p>           <p align="left" style="line-height: 200%"><font face="楷体_GB2312" size="4">&nbsp;           <b><font color="#0000FF">《发阳论》</font></b>是名人4世井上因硕1713年所著，系有名的死活问题专著。因为难解，在本站中独立作为一篇不恰当，因而对该书的介绍，仅以<font color="#0000FF"><b>《棋经众妙》</b></font>所收录的为限。</font></p>         <!--mstheme--></font></td>       </tr>     </table><!--mstheme--><font face="宋体">     </center>   </div>   <p align="center" style="line-height: 150%">　</p> <h2 align="center" style="line-height: 200%"><!--mstheme--><font color="#003366"><a href="Part5/jingong/jingong1.htm"><font face="楷体_GB2312">进攻部分</font></a><!--mstheme--></font></h2> <h2 align="center" style="line-height: 150%"><!--mstheme--><font color="#003366"><a href="Part5/fangshou/fangshou1.htm"><font face="楷体_GB2312">防守部分</font></a><!--mstheme--></font></h2> <p align="center" style="line-height: 200%">　</p> <p align="center" style="line-height: 200%"><font face="楷体_GB2312"><!--webbot bot="Navigation" S-Type="arrows" S-Orientation="horizontal" S-Rendering="graphics" B-Include-Home="FALSE" B-Include-Up="TRUE" U-Page S-Target startspan --><script language="JavaScript"><!-- MSFPhover =    (((navigator.appName == "Netscape") &&    (parseInt(navigator.appVersion) >= 3 )) ||    ((navigator.appName == "Microsoft Internet Explorer") &&    (parseInt(navigator.appVersion) >= 4 )));  function MSFPpreload(img)  {   var a=new Image(); a.src=img; return a;  } // --></script><script language="JavaScript"><!-- if(MSFPhover) { MSFPnav1n=MSFPpreload("_derived/back_cmp_-1110_back.gif"); MSFPnav1h=MSFPpreload("_derived/back_cmp_-1110_back_a.gif"); } // --></script><a href="part4.htm" language="JavaScript" onmouseover="if(MSFPhover) document['MSFPnav1'].src=MSFPnav1h.src" onmouseout="if(MSFPhover) document['MSFPnav1'].src=MSFPnav1n.src"><img src="_derived/back_cmp_-1110_back.gif" width="100" height="20" border="0" alt="上一页" align="middle" name="MSFPnav1"></a> <script language="JavaScript"><!-- if(MSFPhover) { MSFPnav2n=MSFPpreload("_derived/up_cmp_-1110_up.gif"); MSFPnav2h=MSFPpreload("_derived/up_cmp_-1110_up_a.gif"); } // --></script><a href="main.htm" language="JavaScript" onmouseover="if(MSFPhover) document['MSFPnav2'].src=MSFPnav2h.src" onmouseout="if(MSFPhover) document['MSFPnav2'].src=MSFPnav2n.src" target="_top"><img src="_derived/up_cmp_-1110_up.gif" width="100" height="20" border="0" alt="上一层" align="middle" name="MSFPnav2"></a> <script language="JavaScript"><!-- if(MSFPhover) { MSFPnav3n=MSFPpreload("_derived/next_cmp_-1110_next.gif"); MSFPnav3h=MSFPpreload("_derived/next_cmp_-1110_next_a.gif");
