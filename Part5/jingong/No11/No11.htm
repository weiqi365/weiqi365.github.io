<title>第11型 白先黑死</title>

<body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体"><h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第11型      
白先黑死</span></font><!--mstheme--></font></h1>      
<div align="center">      
  <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">      
  <tr>      
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No11_1.png" width="232" height="232"><!--mstheme--></font></td> 
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No11_2.png" width="232" height="232"><!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p> 
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">
      白1点，当然的要点。黑2团眼，尽量抵抗，白不能让a位成眼。白3扳、5断，做好准备，白7曲时，黑8托虽可防白做成刀把五，然而白9打，黑接不归。白3直接于5位挤也可。</span></font><!--mstheme--></font></td> 
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"> 
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p> 
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1</span></font><span style="letter-spacing: 1pt"><font face="楷体_GB2312">点时，黑2如团，白3当然破眼。接下来，黑4如扳，白5立，a、b成见合，黑死；黑4如于5位夹，白4位长，黑a立，白b扳和黑c挡交换一手后，d位长，黑还是不行。这些都是基本功。</font></span><p>　<!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No11_3.png" width="232" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
      <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>
    <!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1</span></font><span style="letter-spacing: 1pt"><font face="楷体_GB2312">打，大随手！黑当然不会笨到去粘两子，只要占到2位双虎，铁定活棋。</font></span></p>
    <!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
  </tr>
</table><!--mstheme--><font face="宋体"></center>
