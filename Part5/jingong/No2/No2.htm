<title>第2型 白先黑死</title>

<body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体"><h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第2型      
白先黑死</span></font><!--mstheme--></font></h1>      
<div align="center">      
  <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">      
  <tr>      
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No2_1.png" width="230" height="256"><!--mstheme--></font></td> 
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No2_2.png" width="232" height="232"><!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"> 
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p> 
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1夹，常用手筋。黑2如遮断，白3断，要紧！黑4打时，白5以下滚打包收（黑8于3位粘），再于9位尖，黑死。</span></font> 
      <p>　<!--mstheme--></font></td> 
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"> 
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p> 
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1扳，黑2如于3位退，白2位再爬一手，黑就死了。所以，黑2必挡，白3断打时，黑4提，白5再打，黑6可顽强做劫，白失败。</span></font><!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No2_3.png" width="232" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
      <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>
    <!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1拐，虽是冷静的一手，然而却是缓手。黑2并，正是此形的急所，请务必牢记。白3再冲，黑4挡，正好做活。</span></font></p>
    <!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
  </tr>
</table><!--mstheme--><font face="宋体"></center>
