<body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体"><h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第31型     
黑先活</span></font><!--mstheme--></font></h1>      
<div align="center">      
  <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">      
  <tr>      
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No31_1.png" width="232" height="232"><!--mstheme--></font></td> 
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No31_2.png" width="232" height="232"><!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"> 
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p>
	<p><span style="letter-spacing: 1pt"><font face="楷体_GB2312">
	黑1断打，白2提，无可厚非。黑3夹，好手，白4冲时，黑5立，又是手筋！白6只好提，黑7拐，净活。白a冲时，黑b的粘是先手，故活棋无忧。白6如敢于c位点，黑6位立，白全灭。</font></span></p><!--mstheme--></font></td> 
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"> 
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p> 
      <p><span style="letter-spacing: 1pt"><font face="楷体_GB2312">
		黑1、白2后，黑3夹，白4冲时，黑5如退，眼位不够。白6简单一扳，黑是“钩形”。若如此，黑1的断等于没有。</font></span><p>　<!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No31_3.png" width="232" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
      <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt">
		<a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>
    <!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>
      <p><span style="letter-spacing: 1pt"><font face="楷体_GB2312">
		黑1、白2后，黑如3位尖，白可4位强硬挡住。黑5的尖虽是局部手筋，然而白6扑，结果还是成劫。白4如于a位抱吃，结果如何？大家先想一想，以后有机会再给大家讲解。</font></span></p><!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
  </tr>
