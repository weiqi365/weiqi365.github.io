<body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体"><h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第10型   
白先黑死</span></font><!--mstheme--></font></h1>      
<div align="center">      
  <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">      
  <tr>      
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No10_1.png" width="232" height="232"><!--mstheme--></font></td> 
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No10_2.png" width="230" height="256"><!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"> 
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p> 
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1扳入，只此一手。黑2断，白3长，黑4打吃，皆属必然。白5夹，手筋！黑6遮断，白7扑，让黑8提，看出来了吗……</span></font><!--mstheme--></font></td> 
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"> 
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p> 
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1再扑，黑2提，白3再于1位左上扑，结果是<font color="#FF0000">双倒扑</font>。</span></font><p>　<!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No10_3.png" width="232" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
      <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>
    <!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1到黑4，一般没有问题。然而，白5如随手一拐，被黑6立，黑就活了。善始还需善终啊！</span></font></p>
    <!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
  </tr>
