<title>第33型 白先黑死</title>

<body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体"><h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第33型   
白先黑死</span></font><!--mstheme--></font></h1>      
<div align="center">      
  <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">      
  <tr>      
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No33_1.png" width="232" height="232"><!--mstheme--></font></td> 
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No33_2.png" width="232" height="232"><!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"> 
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p> 
      <p><span style="letter-spacing: 1pt"><font face="楷体_GB2312">
		白1点，必然。黑2扩大眼位，是最强应手，白3爬，是以静制动的好手。黑4如再次扩大眼位，白5扑、7长，次序精妙，黑死。黑4如于7位挡，白6位点，黑4、白5，结果不变。</font></span> 
      <p>　<!--mstheme--></font></td> 
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"> 
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p> 
      <p><span style="letter-spacing: 1pt"><font face="楷体_GB2312">
		白1、黑2交换后，白3马上点，性急。黑4遮断，白5扑，黑6提，白这才发现黑可于a位三眼两做，悔之晚矣。黑2如于4位扩大眼位，被白于5位扑，不行。</font></span><!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No33_3.png" width="232" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
      <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>
    <!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>
      <p><span style="letter-spacing: 1pt"><font face="楷体_GB2312">
		白1先点也不行。同样道理，黑2遮断，白3扑，黑4提，黑可于a位做活。</font></span></p>
    <!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
  </tr>
</table><!--mstheme--><font face="宋体"></center>
