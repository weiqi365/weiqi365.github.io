	<p><span style="letter-spacing: 1pt"><font face="楷体_GB2312">
	白1嵌，手筋。黑2打，白3长，黑4挡时白5断，是常规套路。黑6提后……</font></span><p>　<!--mstheme--></font></td> 
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>

	<p><span style="letter-spacing: 1pt"><font face="楷体_GB2312">
	白1粘，冷静。黑2拐，白3扳下，黑4断时，白5打，黑6提，白7也提，黑两子粘不上，白是净活。白1万万不可于7位先扑，这里不是做“大头鬼”的地方，扑了等于自杀。</font></span></p>
	<p>　</p>
	<!--mstheme--></font></td>

      <p><span style="letter-spacing: 1pt"><font face="楷体_GB2312">
		白1点，不是地方。黑2粘，已经有四气，白无论如何不行。白3粘，黑4紧气，白明显被杀。</font></span></p><!--mstheme--></font></td>
