<body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体"><h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第18型 
白先劫</span></font><!--mstheme--></font></h1>     
<div align="center">     
  <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">     
  <tr>     
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No18_1.png" width="230" height="256"><!--mstheme--></font></td> 
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No18_2.png" width="232" height="232"><!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"> 
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p>
	<p><span style="letter-spacing: 1pt"><font face="楷体_GB2312">
	不要贪心，活一半就是成功。白1断，手筋！黑如2位打，白3扑是相关联的手段。黑4提，白5再打，黑只好6位提，白7时，黑8必点，结果白9于3位提成劫。</font></span><p>　<!--mstheme--></font></td> 
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"> 
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p>
	<p><span style="letter-spacing: 1pt"><font face="楷体_GB2312">
	白1断时，黑2如从这边打，结果可能更坏。白3反打，好手！黑如4位长，白5再打，搞出一个对黑更不利的大劫。黑4如于a位提，白4位打，变化和前图相同。</font></span></p>
	<p>　</p>
	<!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No18_3.png" width="232" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体">　<!--mstheme--></font></td>
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
      <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt">
		<a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>
    <!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>
      <p><span style="letter-spacing: 1pt"><font face="楷体_GB2312">
		白1、黑2交换后，白不可于3位打。黑4粘，白失去了4位扑的借用，又做不出两眼，只好等死。白3的打原本丧失了变化，但黑如a位提，白4位扑，就又起死回生喽。</font></span></p><!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
  </tr>
</table><!--mstheme--><font face="宋体"></center>
