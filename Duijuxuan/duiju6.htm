<html>  <head> <meta http-equiv="Content-Language" content="zh-cn"> <meta http-equiv="Content-Type" content="text/html; charset=gb2312"> <meta name="GENERATOR" content="Microsoft FrontPage 6.0"> <meta name="ProgId" content="FrontPage.Editor.Document"> <title>第六局</title> <meta name="Microsoft Theme" content="-1 0111, default"> </head>  <body background="../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体">  <h1 align="center" style="line-height: 200%"><!--mstheme--><font color="#660033"><font face="楷体_GB2312">第六局</font><!--mstheme--></font></h1> <p align="center">      <center> <applet    code="GoShow.class"    codebase="Qipu/"    align="top"    width="650"    height="450"  > <param name="game1" value="中国天元网"> <param name=gamestring value=".(;SZ[19]RE[W+Resign] PW[alfrid]WR[3d*] PB[artfly]BR[4d*] ;B[dp]C[本局是天元网高段棋手之间的对局] ;W[pq] ;B[pd] ;W[dd]C[对角的布局是偏向战斗的] ;B[qo] ;W[qm] ;B[oo] ;W[np] ;B[lp] ;W[no] ;B[pm] ;W[ql] ;B[nn] ;W[mn] ;B[nm] ;W[lo] ;B[qj]C[黑17夹攻的位置不妥，应在星位高夹是定式] ;W[qp] ;B[qn] ;W[fq] ;B[cn] ;W[ip]C[白22就这样认为下边是自己的，有点贪婪，本手是在L4位扳，厚实，将来这里白棋已经没有心情再去补棋只有看着黑棋来动手，其实这里要活出很简单，白棋棋形实在太薄弱] ;B[fc] ;W[jd] ;B[cf] ;W[ee] ;B[cc] ;W[dc] ;B[cd] ;W[dg] ;B[df] ;W[ef] ;B[eg]C[黑31冲断后，这里形成战斗] ;W[di] ;B[fg] ;W[cg] ;B[bg] ;W[bh] ;B[bf] ;W[ge] ;B[fi] ;W[dk]C[至白42止，双方可战] ;B[eq] ;W[fp]C[黑43与白44的交换是恶手，第一黑棋角还是没有围住，第二帮助白棋加强右边，损] ;B[lc] ;W[qc]C[白46点角，置上边不顾，贪婪。] ;B[qd] ;W[pc] ;B[nc] ;W[nb] ;B[mb] ;W[oc] ;B[od] ;W[nd] ;B[mc] ;W[rd] ;B[re] ;W[rc] ;B[qf] ;W[pj] ;B[qi] ;W[cq] ;B[er] ;W[cp]C[白64爬的下法欠妥，应在B5飞] ;B[co] ;W[do] ;B[eo] ;W[ep] ;B[dq] ;W[dn] ;B[dm] ;W[en] ;B[cr] ;W[br] ;B[bs] ;W[bo] ;B[bn] ;W[bp] ;B[aq] ;W[ds] ;B[bq] ;W[cm] ;B[ao]C[黑83直接吃，不可解，为什么不在白84位叫吃？右边白棋虽然能挡一下，但是中间薄了很多] ;W[bm] ;B[ap] ;W[em]C[白86厚实] ;B[ih] ;W[kh] ;B[ij] ;W[hg]C[白90过分，其实周围黑棋子力明显多，白棋还要欺负黑棋，太无理] ;B[ig]C[黑91开始反击，白棋形状但是裂开] ;W[hf] ;B[if] ;W[kf] ;B[ie]C[黑95长后，白棋形状破碎的感觉] ;W[hc] ;B[id] ;W[ic] ;B[jc] ;W[kd] ;B[hd] ;W[fb] ;B[gc]C[黑103大俗手，应简单在G16退回，白棋难应] ;W[jb] ;B[kc] ;W[gb] ;B[ob] ;W[pb] ;B[na] ;W[pa] ;B[me]C[黑111后，其实上边白差了一手棋，本来白棋还要在上面补，现在不用了] ;W[ji] ;B[ii] ;W[cb] ;B[bb] ;W[db] ;B[bi] ;W[ci] ;B[ah]C[黑117、119逸机！当然应该在L9飞，估计上边白棋已经不能逃脱了，角上是打劫杀，黑棋不怕] ;W[mf] ;B[ke] ;W[je] ;B[jf] ;W[le] ;B[ld] ;W[pl]C[白126还要从这里逃出，很勇敢，真是战斗之神、体力充沛，难道在中间一带侵消，目数不够吗？] ;B[nk]C[黑127跳后，真有点担心，白棋怎样腾挪？！] ;W[om] ;B[on] ;W[pn] ;B[po]C[白棋为了活棋，被黑粘到131，下面白棋已经出了问题，将来黑棋P3,白棋抵挡不住了] ;W[pi] ;B[ph]C[黑133跟着白棋走，没有道理，当然应在P9先刺O11再跳] ;W[oh] ;B[pg]C[黑137为何不在白138刺呢？] ;W[nj] ;B[mj] ;W[ok] ;B[nl] ;W[mi] ;B[ni] ;W[oj] ;B[lj] ;W[mh]C[实战就这样被白144活出，黑棋的力量有点软。看了双方的着法，觉得白棋非常霸道，十分无理，碰到高手恐怕会折断，所以下棋还是要有棋理，厚薄也要注意，不是一味的搏杀。黑棋缺乏一锤定音的着法，本局措施了好多机会，让白棋无理得逞] ) ."></applet></center> </p>  <p align="center">      <!--webbot bot="Navigation" S-Type="arrows" S-Orientation="horizontal" S-Rendering="graphics" B-Include-Home="FALSE" B-Include-Up="TRUE" U-Page S-Target startspan --><script language="JavaScript"><!-- MSFPhover =    (((navigator.appName == "Netscape") &&    (parseInt(navigator.appVersion) >= 3 )) ||    ((navigator.appName == "Microsoft Internet Explorer") &&    (parseInt(navigator.appVersion) >= 4 )));  function MSFPpreload(img)  {   var a=new Image(); a.src=img; return a;  } // --></script><script language="JavaScript"><!-- if(MSFPhover) { MSFPnav1n=MSFPpreload("../_derived/back_cmp_-1110_back.gif"); MSFPnav1h=MSFPpreload("../_derived/back_cmp_-1110_back_a.gif"); } // --></script><a href="duiju5.htm" language="JavaScript" onmouseover="if(MSFPhover) document['MSFPnav1'].src=MSFPnav1h.src" onmouseout="if(MSFPhover) document['MSFPnav1'].src=MSFPnav1n.src"><img src="../_derived/back_cmp_-1110_back.gif" width="100" height="20" border="0" alt="上一页" align="middle" name="MSFPnav1"></a> <script language="JavaScript"><!-- if(MSFPhover) { MSFPnav2n=MSFPpreload("../_derived/up_cmp_-1110_up.gif"); MSFPnav2h=MSFPpreload("../_derived/up_cmp_-1110_up_a.gif"); } // --></script><a href="../duijuxuan.htm" language="JavaScript" onmouseover="if(MSFPhover) document['MSFPnav2'].src=MSFPnav2h.src" o
