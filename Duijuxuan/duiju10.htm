<center>

   code="GoShow.class"

   height="450"
 >
<param name="game1" value="中国天元网">
<param name=gamestring value=".(;SZ[19]RE[B+Resign] PW[alvin]WR[2d*] PB[cjq]BR[2d*]
;B[pd]C[本局是天元网上cjp2D*执黑对alvin2D*的对局]
;W[dd]
;B[qp]
;W[dq]
;B[do]
;W[dl]
;B[fo]
;W[fq]
;B[cq]
;W[cr]
;B[cp]
;W[br]
;B[ho]
;W[hq]
;B[di]
;W[cg]C[布局至16比较正常，在谱中也见到过]
;B[eh]C[黑17有背书嫌疑，我推荐此时黑棋走E9更妥当]
;W[gn]
;B[go]
;W[gl]C[白18、20出动机敏，白棋从这里动出，我们再来看一下，其实黑棋是两块未安定的棋，而白棋只有一块，所以当初黑17有问题]
;B[in]C[黑21不如堂堂正正的在K5关出]
;W[il]
;B[fm]
;W[fl]
;B[ek]
;W[el]
;B[iq]C[黑27在下边整形，好象不是本局的焦点，此时上边两子更显孤单，应该跑上边两子]
;W[ir]
;B[jq]
;W[jr]
;B[kq]
;W[hp]
;B[ip]C[白32与黑33的交换，显然不便宜]
;W[kr]
;B[mq]
;W[gh]C[但是白终于争到了大势要点，抢先攻击上边两子，可是白36的攻击手法，值得探讨。这手棋不如在h12来得好。]
;B[ef]
;W[dg]
;B[eg]
;W[fi]C[白40有手软嫌疑，应该在G14继续追击黑棋]
;B[fd]
;W[dc]
;B[hf]C[黑43形不正，欲速则不达，将来白棋在G15穿象眼，黑棋形状顿显破绽]
;W[qf]
;B[nd]
;W[qn]C[白46没有必要，应在r10位拆一手稳健一些]
;B[qk]C[黑47反击]
;W[qq]
;B[pp]
;W[pq]
;B[op]
;W[rp]
;B[ro]
;W[rq]
;B[qo]
;W[nr]C[白56大有疑问，应该在P3位爬，力求争得先手，然后右上白子再加强]
;B[qe]
;W[pf]
;B[ph]C[黑57、59闪电般的抓住了机会，黑棋局势开始扭转。本局双方要注意的是棋的形状感觉，不要按部就班，要时刻注意全局的重点在哪里。 sihfu简评]
)
."></applet></center>
