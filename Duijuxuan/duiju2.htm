<html>  <head> <meta http-equiv="Content-Language" content="zh-cn"> <meta http-equiv="Content-Type" content="text/html; charset=gb2312"> <meta name="GENERATOR" content="Microsoft FrontPage 6.0"> <meta name="ProgId" content="FrontPage.Editor.Document"> <title>第二局</title> <meta name="Microsoft Theme" content="-1 0111, default"> </head>  <body background="../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体">  <h1 align="center" style="line-height: 200%"><!--mstheme--><font color="#660033"><font face="楷体_GB2312">第二局</font><!--mstheme--></font></h1> <p align="center">      <center> <applet    code="GoShow.class"    codebase="Qipu/"    align="top"    width="650"    height="450"  > <param name="game1" value="中国天元网"> <param name=gamestring value=".(;SZ[19]RE[B+9.5] PW[jingsoft]WR[1d ] PB[laoda]BR[1d*]  ;B[pd]C[本局是天元网上laoda1D*执黑与1d没有*的jingsoft的对局] ;W[dp] ;B[pq] ;W[dd] ;B[jp]C[黑5单拆，变化更多] ;W[qf] ;B[qh] ;W[qn] ;B[qk] ;W[qc]C[白10点上边的三三，不如在右下完成定式，因为从黑棋阵势上看，黑棋下边已经有一个子配合，而上边还没有，所以下面更加重要] ;B[qd] ;W[pc] ;B[od] ;W[rd] ;B[re] ;W[rc] ;B[qe] ;W[nc] ;B[po] ;W[rp] ;B[pn] ;W[qm] ;B[pm] ;W[ql] ;B[pl]C[黑21的下法非常简明，上下连片，模样非常壮观] ;W[rk] ;B[qj] ;W[rj] ;B[ri] ;W[qq] ;B[qr] ;W[rr] ;B[qp] ;W[rq]C[布局至白34，显然黑棋布局更加生动，所以以后大家在行棋的时候，要注意全局，因为围棋不是简单的做活和破空] ;B[fq]C[黑35低挂，有点教科书了，本局黑棋是模样的情况下，子力应该尽量走在高位，所以黑棋在F4挂角] ;W[dn]C[白36普通，可以考虑在F5压缩黑棋模样] ;B[dr]C[黑37教条！没有注意现在双方子力处于什么样的境地，黑棋在这个局面下应该往当中走，所以G6是好点] ;W[cq] ;B[fo] ;W[kn] ;B[lo] ;W[ln] ;B[mo] ;W[lk] ;B[lc]C[黑45的远攻，是否太遥远了？走K9更直接，因为右边黑棋实在太厚实] ;W[mc] ;B[ld] ;W[fc]C[白48应在中间加强] ;B[li] ;W[ne] ;B[nd] ;W[md] ;B[me]C[白50跳出之后的战斗明显是黑棋有利，因为白棋中间还有一块负担] ;W[le] ;B[mf] ;W[ke] ;B[lb] ;W[mb] ;B[jd] ;W[je] ;B[id] ;W[ie] ;B[hd] ;W[gf] ;B[fd] ;W[gc] ;B[he] ;W[hf] ;B[fe] ;W[ff]C[白70紧贴对手，都是爱好者喜欢的下法，但是在攻击中不适合，围棋攻击口诀“攻要松”所以白棋在E13飞，柔软] ;B[de] ;W[cd] ;B[ef] ;W[ed] ;B[ee] ;W[fh] ;B[ig] ;W[if] ;B[dh]C[黑79后，全局黑棋领先。通过此局，双方在以后的对局中要注意子和子的配合，什么样的局面下面下什么样的棋。以下略 shifu] ) ."></applet></center> </p>  <p align="center">
