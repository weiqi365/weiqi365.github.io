<html>  <head> <meta http-equiv="Content-Language" content="zh-cn"> <meta http-equiv="Content-Type" content="text/html; charset=gb2312"> <meta name="GENERATOR" content="Microsoft FrontPage 6.0"> <meta name="ProgId" content="FrontPage.Editor.Document"> <title>第十二局</title> <meta name="Microsoft Theme" content="-1 0111, default"> </head>  <body background="../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体">  <h1 align="center" style="line-height: 200%"><!--mstheme--><font color="#660033"><font face="楷体_GB2312">第十二局</font><!--mstheme--></font></h1> <p align="center">      <center> <applet    code="GoShow.class"    codebase="Qipu/"    align="top"    width="650"    height="450"  > <param name="game1" value="中国天元网"> <param name=gamestring value=".(;SZ[19]RE[B+Time] PW[sztsai]WR[3k*] PB[xuking]BR[3k*] ;B[pd]C[本局是天元网上棋友xuking3K*执黑与sztsai3K*的对局] ;W[pp] ;B[dc] ;W[cp] ;B[ep] ;W[cn]C[白6小跳是定式的一种，但是这里白棋有骗着，由于没有变化图显示，这里我只能简略了] ;B[iq]C[黑7回避，显得软弱，应该在C3托，如果担心白棋这里的手段，请查阅定式书] ;W[eq] ;B[dq]C[黑9内扳，损。还是在外扳，白棋退，黑棋再脱先] ;W[dp] ;B[fq] ;W[er] ;B[fr] ;W[dr] ;B[nq]C[黑15在左边脱先，还是很灵活的，由于左边白棋都已经厚实了，黑5这子已经无关紧要了。] ;W[kp]C[白16在这里还要夹击，过分了一点，平凡的在右边小飞应，已经可以满足] ;B[qq]C[黑17选择点角，变化太简单了，下边子力比较。明显黑棋占优，所以应该选择求战，应在O5跳起] ;W[pq] ;B[qp] ;W[po] ;B[pr] ;W[or] ;B[qr] ;W[oq] ;B[qn] ;W[kr]C[白26防守，有必要] ;B[nr]C[黑27再动出就显得有些牵强了，这个行棋思路和当初的点角就违背了，如果要战就早战，如果不战就应该走大场，下棋思维要保持一致] ;W[ns] ;B[lq] ;W[kq] ;B[np]C[黑31的步伐，也太慢了一点，应该跳出] ;W[pn] ;B[qm] ;W[mo]C[白32、34后，黑棋已经无法出逃，亏损] ;B[pm] ;W[nn]C[白36形不正，这是业余爱好者通常的错误，以为吃的大一点就是好的，其实不然，将来黑棋长还是先手，白棋还要补，就已经亏损了。这里的本手是O5压住，厚实且黑棋没有利用] ;B[qf]C[黑37不如守无忧角] ;W[de] ;B[cg] ;W[ef] ;B[eg] ;W[cc] ;B[cd] ;W[dd] ;B[ce] ;W[cf] ;B[bf] ;W[df] ;B[bd] ;W[ec] ;B[db] ;W[dg] ;B[ch] ;W[dh] ;B[ci] ;W[eb] ;B[cb]C[棋谱只有57手，至本局的局面，下一手白棋在L17的位置开拆后，是白棋好的局面。从整个过程看，双方要加强的地方很多，黑棋主要是在定式方面要下工夫，白棋则在棋形和子力比较上要加强。 shifu] ) ."></applet></center> </p>  <p align="center">      <!--webbot bot="Navigation" S-Type="arrows" S-Orientation="horizontal" S-Rendering="graphics" B-Include-Home="FALSE" B-Include-Up="TRUE" U-Page S-Target startspan --><script language="JavaScript"><!-- MSFPhover =    (((navigator.appName == "Netscape") &&    (parseInt(navigator.appVersion) >= 3 )) ||    ((navigator.appName == "Microsoft Internet Explorer") &&    (parseInt(navigator.appVersion) >= 4 )));  function MSFPpreload(img)  {   var a=new Image(); a.src=img; return a;  } // --></script><script language="JavaScript"><!-- if(MSFPhover) { MSFPnav1n=MSFPpreload("../_derived/back_cmp_-1110_back.gif"); MSFPnav1h=MSFPpreload("../_derived/back_cmp_-1110_back_a.gif"); } // --></script><a href="duiju11.htm" language="JavaScript" onmouseover="if(MSFPhover) document['MSFPnav1'].src=MSFPnav1h.src" onmouseout="if(MSFPhover) document['MSFPnav1'].src=MSFPnav1n.src"><img src="../_derived/back_cmp_-1110_back.gif" width="100" height="20" border="0" alt="上一页" align="middle" name="MSFPnav1"></a> <script language="JavaScript"><!-- if(MSFPhover) { MSFPnav2n=MSFPpreload("../_derived/up_cmp_-1110_up.gif"); MSFPnav2h=MSFPpreload("../_derived/up_cmp_-1110_up_a.gif"); } // --></script><a href="../duijuxuan.htm" language="JavaScript" onmouseover="if(MSFPhover) document['MSFPnav2'].src=MSFPnav2h.src" onmouseout="if(MSFPhover) document['MSFPnav2'].src=MSFPnav2n.src"><img src="../_derived/up_cmp_-1110_up.gif" width="100" height="20" border="0" alt="上一层" align="middle" name="MSFPnav2"></a> <script language="JavaScript"><!-- if(MSFPhover) { MSFPnav3n=MSFPpreload("../_derived/next_cmp_-1110_next.gif"); MSFPnav3h=MSFPpreload("../_derived/next_cmp_-1110_next_a.gif"); } // --></script><a href="duiju13.htm" language="JavaScript" onmouseover="if(MSFPhover) document['MSFPnav3'].src=MSFPnav3h.src" onmouseout="if(MSFPhover) document['MSFPnav3'].src=MSFPnav3n.src"><img src="../_derived/next_cmp_-1110_next.gif" width="100" height="20" border="0" alt="下一页" align="middle" name="MSFPnav3"></a><!--webbot bot="Navigation" i-checksum="21155" endspan --> </p>  <p align="center">      　 <
