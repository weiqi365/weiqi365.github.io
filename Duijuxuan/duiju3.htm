<html>  <head> <meta http-equiv="Content-Language" content="zh-cn"> <meta http-equiv="Content-Type" content="text/html; charset=gb2312"> <meta name="GENERATOR" content="Microsoft FrontPage 6.0"> <meta name="ProgId" content="FrontPage.Editor.Document"> <title>第三局</title> <meta name="Microsoft Theme" content="-1 0111, default"> </head>  <body background="../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体">  <h1 align="center" style="line-height: 200%"><!--mstheme--><font color="#660033"><font face="楷体_GB2312">第三局</font><!--mstheme--></font></h1> <p align="center">      <center> <applet    code="GoShow.class"    codebase="Qipu/"    align="top"    width="650"    height="450"  > <param name="game1" value="中国天元网"> <param name=gamestring value=".(;SZ[19]RE[B+9.5] PW[kwok]WR[4d*] PB[tangyi]BR[3d*] ;B[pd]C[本局是天元网上3D*tangyi执黑对4D*Kwok的对局] ;W[qp] ;B[dd] ;W[co] ;B[op] ;W[pn]C[白6选择这个定式，从局部看是白棋先损实地的下法，全部也没有什么明显的配合，我觉得不够积极，应该考虑夹击黑棋] ;B[qq] ;W[rq] ;B[pq] ;W[ro] ;B[kq] ;W[cf] ;B[fc] ;W[di] ;B[ep] ;W[dq] ;B[eq] ;W[dr] ;B[dn]C[黑19飞压，有过凶的感觉] ;W[do] ;B[eo] ;W[en]C[白20、22冲断必然] ;B[dl]C[黑23跳，手筋] ;W[er]C[白24冷静] ;B[gp] ;W[dm] ;B[em] ;W[cn] ;B[fn] ;W[el]C[然后白26至30选择了那实地的下法] ;B[dn] ;W[cm] ;B[ek]C[黑33翻打恶手，应该在D10碰，是处理的手筋，这个和前面黑23跳的效果是一样的。怎么这里黑棋不会碰了呢？白棋如果在S9吃，黑棋再E10长，白棋难受] ;W[fl] ;B[dj]C[黑35再虎，形状恶] ;W[ei] ;B[fk] ;W[gl] ;B[gk] ;W[cl]C[白40打，舒服] ;B[dk] ;W[hl] ;B[hk] ;W[il] ;B[ce] ;W[ik] ;B[hi] ;W[bj] ;B[ij]C[白46至黑49的结果，白棋并不便宜，中间黑49虎，形状非常好，白46要么就不要拐，直接在D14长，要么白48就再在49位长] ;W[kk] ;B[kj] ;W[lj] ;B[ki] ;W[lk] ;B[mh] ;W[df] ;B[nj] ;W[ip]C[白58打入手筋] ;B[iq] ;W[jq] ;B[ir] ;W[hp] ;B[gq] ;W[jp] ;B[jr]C[白64与黑65交换是俗手，这里应该保留，将来有L4的先手，直接在66位打入，黑棋难应] ;W[mp] ;B[mq] ;W[nq] ;B[np] ;W[lq] ;B[mr] ;W[kr] ;B[lr] ;W[kp] ;B[ks]C[实战至黑75渡过，白棋其实在这里的战果便宜不是很大] ;W[hq] ;B[hr] ;W[ls]C[白78直接开劫，准备工作不足] ;B[kq] ;W[kc]C[白80只能分投，那下边开劫就显得很不明智] ;B[lp] ;W[nc] ;B[nl]C[黑83跳后，攻防逆转] ;W[mm] ;B[nm] ;W[mo] ;B[lo] ;W[ln] ;B[ko] ;W[nn] ;B[kn] ;W[km] ;B[nd] ;W[md] ;B[oc] ;W[ne] ;B[od] ;W[me] ;B[ic] ;W[nb] ;B[ob] ;W[ke]C[白102过于稳健，无论如何要在右边飞下，或者在左上点三三] ;B[pf]C[黑103后，全局实空黑棋明显领先] ;W[ok] ;B[nk] ;W[qk] ;B[pm] ;W[qn] ;B[qi] ;W[jn] ;B[jb] ;W[id] ;B[jc] ;W[jd] ;B[kb] ;W[lb] ;B[lc] ;W[mc] ;B[kd] ;W[ld] ;B[kc]C[白112至黑121后，白棋自己整块眼位也不足] ;W[hd] ;B[gc] ;W[kg] ;B[lf] ;W[lg] ;B[li] ;W[jo]C[白128后手] ;B[bf] ;W[bg] ;B[be]C[黑129、131扳粘极大！] ;W[lq] ;B[lp] ;W[mg]C[白134又过于稳健了！！！] ;B[rl] ;W[ql] ;B[rk] ;W[qm] ;B[oh]C[黑135至139又是一套组合拳，全局黑棋已经没有不活的棋，实空又遥遥领先，胜定。综观全局，白棋在战斗方面比较胆小，对于全局形式判断也不够精确，这是白棋要加强的，以下略 shifu] ) ."></applet></center> </p>  <p align="center">      <!--webbot bot="Navigation" S-Type="arrows" S-Orientation="horizontal" S-Rendering="graphics" B-Include-Home="FALSE" B-Include-Up="TRUE" U-Page S-Target startspan --><script language="JavaScript"><!-- MSFPhover =    (((navigator.appName == "Netscape") &&    (parseInt(navigator.appVersion) >= 3 )) ||    ((navigator.appName == "Microsoft Internet Explorer") &&    (parseInt(navigator.appVersion) >= 4 )));  function MSFPpreload(img)  {   var a=new Image(); a.src=img; return a;  } // --></script><script language="JavaScript"><!-- if(MSFPhover) { MSFPnav1n=MSFPpreload("../_derived/back_cmp_-1110_back.gif"); MSFPnav1h=MSFPpreload("../_derived/back_cmp_-1110_back_a.gif"); } // --></script><a href="duiju2.htm" language="JavaScript" onmouseover="if(MSFPhover) document['MSFPnav1'].src=MSFPnav1h.src" onmouseout="if(MSFPhover) document['MSFPnav1'].src=MSFPnav1n.src"><img src="../_derived/back_cmp_-1110_back.gif" width="100" height="20" border="0" alt="上一页" align="middle" name="MSFPnav1"></a> <script language="JavaScript"><!-- if(MSFPhover) { MSFPnav2n=MSFPpreload("../_derived/up_cmp_-1110_up.gif"); MSFPnav2h=MSFPpreload("../_derived/up_cmp_-1110_up_a.gif"); } // --></script><a href="../duijuxuan.htm" language="JavaScript" onmouseover="if(MSFPhover) document['MSFPnav2'].src=MSFPnav2h.src" onmouseout="if(MSFPhover) document['MSFPnav2'].src=MSFPnav2n.src"><img src="../_derived/up_cmp_-1110_up.gif" width="100" height="2
