<p align="center">

   
<center>
<applet
   code="GoShow.class"
   codebase="Qipu/"
   align="top"
   width="650"
   height="450"
 >
<param name="game1" value="中国天元网">
<param name=gamestring value=".(;SZ[19]RE[W+Resign] PW[shenhua]WR[2d*] PB[suede]BR[2d*]
;B[pd]C[本局是天元网上棋友suede2D*执黑对shenhua2D*的对局]
;W[dp]
;B[pp]
;W[dd]
;B[fq]
;W[jp]
;B[cq]
;W[dq]
;B[cp]
;W[do]
;B[dr]
;W[er]
;B[cr]
;W[eq]
;B[cn]C[布局至黑15，是普通常见的布局]
;W[nq]
;B[qn]
;W[em]C[白16、18扩张下边的下法，气势很足，但是未免太薄弱了，白18不如在F4厚实]
;B[cm]
;W[pr]
;B[qq]
;W[no]C[白22后，下边马上形成双方必争之处]
;B[fr]C[黑夹也可以在F5跳，直接面对白棋的弱点，白棋较难办]
;W[fs]
;B[gs]
;W[es]
;B[fo]C[黑27跳有问题，不如在H3跳是形状要点。]C[白28打吃，机敏]
;W[gr]
;B[gq]
;W[hr]
;B[hq]
;W[iq]
;B[dn]C[黑33直接用“愚形”冲断，未免操之过急了，应该在J5整形，先把自己处理好，如果白棋在左边联络，那也是单官。]
;W[en]
;B[eo]
;W[go]C[白36顶，漂亮的手筋！]
;B[ir]
;W[hs]
;B[fp]
;W[fn]
;B[ip]C[黑41为了出头把下边先送死，痛心但是没有办法]
;W[jq]
;B[ho]
;W[in]C[白44飞，是否太过潇洒了，当然应该在H6继续保持对黑棋的攻击]
;B[hn]
;W[hm]
;B[io]
;W[jo]
;B[gn]
;W[gm]
;B[gp]C[至黑51，黑棋做活。这里的冲突明显是白棋便宜，但是白棋在占据攻击主动的时候，轻易就放弃攻击，是草率的选择，现在黑棋已活，虽然白棋局面领先，但是胜负道路还漫长]
;W[dk]C[白52无理！]
;B[jc]C[黑53错过机会，这时在E8位顶，白棋有马上要崩溃的感觉]
;W[qf]
;B[nc]C[黑55也很奇怪，不如单关跳]
;W[rd]
;B[qg]
;W[pg]
;B[qh]
;W[ph]
;B[qi]
;W[pe]
;B[qd]
;W[qe]C[白64不懂定式，这里白棋可以在S17挺进角上，黑棋不能切断白棋]
;B[rc]
;W[ql]C[白66打入！凶狠，但是看到这里，我感觉到，白棋的下法是追求过瘾，没有全局的判断，并且无理手很多，其实在这里，白棋只需要在Q11压，把黑棋封在右边，自己与中间联络，构成中腹强大势力，即可简明保持绝对优势]
;B[pi]
;W[od]
;B[oc]
;W[of]C[黑67拐出后，白棋自己先忙着做活，损]
;B[pm]C[黑71直接封锁，着急了一点，不如在O11关出，堂堂正正，还能继续威胁上边白棋]
;W[pl]
;B[ol]
;W[ok]
;B[pk]
;W[pj]
;B[oj]C[黑77计算有误，在R9跑，吃掉白棋右边两子，即可满足]
;W[qk]C[白棋提掉后，打劫已经不可避免]
;B[nk]
;W[nj]
;B[pk]
;W[qc]
;B[pc]C[白棋打吃角上，黑棋应劫是败着。先研究一下这个劫，这个劫是天下劫，对于黑棋来说是绝对不能败的，所以黑棋应该消劫，然而最关键的还在后面......]
;W[ok]
;B[oi]
;W[nl]
;B[pk]
;W[co]C[白棋88冲是胜着！舍身炸碉堡的劫材！，黑棋不能不应]
;B[bo]
;W[ok]
;B[is]
;W[mk]C[黑棋91吃掉下面，不过只有30余目，但是右边被白棋开花，损失更惨重！也可以说，棋局已经结束了。]
;B[nh]
;W[mg]C[白94飞后，黑棋要取胜已经很渺茫，以下略。shifu]
)
."></applet></center>
