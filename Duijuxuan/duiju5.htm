;B[ge] ;W[gf] ;B[hf]C[黑93内扳不好，让白棋轻松处理了，这里黑棋应该外扳，不让白棋腾挪] ;W[he] ;B[gg] ;W[gd] ;B[ff] ;W[hc]C[白98虎后，上边一块只要做活，白棋就胜了] ;B[dc] ;W[jb] ;B[jc] ;W[ib] ;B[kb] ;W[ob]C[白104太贪了，应该自己补一手] ;B[je] ;W[jf] ;B[id]C[黑105、107反击得手] ;W[nd] ;B[od] ;W[ld] ;B[lc] ;W[ne] ;B[me] ;W[hd] ;B[if] ;W[oe] ;B[jg]C[黑棋117后，局面稍有挽回] ;W[ec] ;B[cc] ;W[eb] ;B[gb] ;W[ee] ;B[fe] ;W[fd] ;B[ic] ;W[hb] ;B[ga]C[黑127下立杀这块白棋，看来是已经杀红眼了，因为这是一块白棋脱先也是活的棋] ;W[db]C[白棋拐后，黑棋杀活棋已经不行了以下略 shifu]  ) ."></applet></center> </p>  <p align="center">      <!--webbot bot="Navigation" S-Type="arrows" S-Orientation="horizontal" S-Rendering="graphics" B-Include-Home="FALSE" B-Include-Up="TRUE" U-Page S-Target startspan --><script language="JavaScript"><!-- MSFPhover =    (((navigator.appName == "Netscape") &&    (parseInt(navigator.appVersion) >= 3 )) ||    ((navigator.appName == "Microsoft Internet Explorer") &&    (parseInt(navigator.appVersion) >= 4 )));  function MSFPpreload(img)  {   var a=new Image(); a.src=img; return a;  } // --></script><script language="JavaScript"><!-- if(MSFPhover) { MSFPnav1n=MSFPpreload("../_derived/back_cmp_-1110_back.gif"); MSFPnav1h=MSFPpreload("../_derived/back_cmp_-1110_back_a.gif"); } // --></script><a href="duiju4.htm" language="JavaScript" onmouseover="if(MSFPhover) document['MSFPnav1'].src=MSFPnav1h.src" onmouseout="if(MSFPhover) document['MSFPnav1'].src=MSFPnav1n.src"><img src="../_derived/back_cmp_-1110_back.gif" width="100" height="20" border="0" alt="上一页" align="middle" name="MSFPnav1"></a> <script language="JavaScript"><!-- if(MSFPhover) { MSFPnav2n=MSFPpreload("../_derived/up_cmp_-1110_up.gif"); MSFPnav2h=MSFPpreload("../_derived/up_cmp_-1110_up_a.gif"); } // --></script><a href="../duijuxuan.htm" language="JavaScript" onmouseover="if(MSFPhover) document['MSFPnav2'].src=MSFPnav2h.src" onmouseout="if(MSFPhover) document['MSFPnav2'].src=MSFPnav2n.src"><img src="../_derived/up_cmp_-1110_up.gif" width="100" height="20" border="0" alt="上一层" align="middle" name="MSFPnav2"></a> <script language="J
