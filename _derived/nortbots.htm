<html>  <head> <meta http-equiv="Content-Type" content="text/html; charset=gb2312"> <meta name="GENERATOR" content="Microsoft FrontPage 3.0"> <title>FrontPage 运行态组件网页</title> <meta name="Microsoft Theme" content="-1 0111, default"> <meta name="Microsoft Border" content="none, default"> </head>  <body background="../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体">  <h1><!--mstheme--><font color="#660033">FrontPage 运行态组件网页<!--mstheme--></font></h1>  <p>您提交了一张表单或以链接形式进入了一张网页，而此表单或网页需要有站点服务器和 FrontPage 服务器扩展才能正常工作。</p>  <p>将此站点发布到安装有 FrontPage 服务器扩展的站点服务器上后，该表单或其他 FrontPage 组件就可以正常工作了。</p>  <h2><!--mstheme--><font color="#003366">请单击 &lt;后退&gt; 箭头返回上一页。<!--mstheme--></font></h2> <!--mstheme--></font></body> </html>
