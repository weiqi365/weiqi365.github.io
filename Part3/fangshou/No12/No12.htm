	<p><span style="letter-spacing: 1pt"><font face="楷体_GB2312">
	黑1提，白面临两难。如果点曲三吧，黑a位断，由于黑</font></span><font face="宋体">*</font><font face="楷体_GB2312"><span style="letter-spacing: 1pt">子的作用，正好接不归。结果黑是净活。</span></font></p>

      <p><span style="letter-spacing: 1pt"><font face="楷体_GB2312">
