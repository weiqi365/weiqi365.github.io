<title>第61型 黑先活</title>

<body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体">
<h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第61型     
黑先活</span></font><!--mstheme--></font></h1>
<div align="center">
  <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">
  <tr>
    <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">
	<img border="0" src="No61_1.png" width="232" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">
	<img border="0" src="No61_2.png" width="232" height="232"><!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">根据“左右同形走中间”的格言，黑1是正解。研究此型的目的是想说明，别看黑的眼位看上去不少，黑1只此一手！</span></font><!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">在以前研究过的类似棋形中，都是走黑1的立，因为官子最合算。然而在此，黑1立有重大缺陷……</span></font>
      <p>　<!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">
	<img border="0" src="No61_3.png" width="232" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">
      <p><img border="0" src="No61_4.png" width="232" height="232"></p>    
    <!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"> 
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p> 
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1扳，是大恶手。然而黑2如挡，却也臭不可闻。如此白3托，黑4、白5成劫。</span></font></p>
      <p>　</p>
    <!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图4</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1扳时，黑当然应该应在2位，如此黑净活。白1没有击在黑的要害上。</span></font></p>
    <!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="middle" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No61_5.png" width="232" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="middle" align="center"><!--mstheme--><font face="宋体">
      <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>
    <!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图5</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1才是急所。黑2即使立，白3扳，黑仍死。这也是典型的盘角曲四，换句话说，黑</font><font face="黑体">*</font><font face="楷体_GB2312">立等于自杀。</span></font></p>
    <!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
  </tr>
</table><!--mstheme--><font face="宋体"></center>
</div>
