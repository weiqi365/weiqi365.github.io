<title>第2型 白先黑死</title>

<body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体">

<h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第2型                     
白先黑死</span></font><!--mstheme--></font></h1> 
<div align="center"> 
  <center><!--mstheme--></font><table border="0" width="800" cellspacing="5"> 
  <tr> 
    <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">
	<img border="0" src="No2_1.png" width="232" height="232"><!--mstheme--></font></td> 
    <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">
	<img border="0" src="No2_2.png" width="232" height="232"><!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"> 
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p> 
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1靠，正解。</span></font><font face="楷体_GB2312"><span style="letter-spacing: 1pt">气紧板六的致命弱点就是a位的不入气，请牢记。</span></font> 
      <p>　<!--mstheme--></font></td> 
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"> 
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p> 
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1败招。至白5提，成劫。（站长昏死过去）注意：黑4如不扑，被白于4位长，成盘角曲四！</span></font><!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">
	<img border="0" src="No2_3.png" width="232" height="232"><!--mstheme--></font></td> 
    <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">
	<img border="0" src="No2_4.png" width="232" height="232"><!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"> 
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p> 
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">外面空了一气，还下在老地方吗？显然，至黑4黑轻松成活。</span></font></p> 
      <p>　</p> 
    <!--mstheme--></font></td> 
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图4</span></font></p> 
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">此时下在1位就对了。白5提，成劫。</span></font></p> 
    <!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" valign="middle" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No2_5.png" width="232" height="232"><!--mstheme--></font></td> 
    <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" valign="middle" align="center"><!--mstheme--><font face="宋体"> 
      <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1> 
    <!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图5</span></font></p> 
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">外面空两气。黑4扑，白5提，黑6吃胀牯牛活。</span></font></p>
    <!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">　
      <p><font face="楷体_GB2312" color="#FF0000"><span style="letter-spacing: 1pt">结论：气紧则死，一气成劫，二气活棋。</span></font><!--mstheme--></font></td>
  </tr>
</table><!--mstheme--><font face="宋体"></center>
