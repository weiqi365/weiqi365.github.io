<title>第119型 白先劫</title>

<body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体"><h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第119型   
白先劫</span></font><!--mstheme--></font></h1> 
<div align="center"> 
  <center><!--mstheme--></font><table border="0" width="800" cellspacing="5"> 
  <tr> 
    <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">
	<img border="0" src="No119_1.png" width="232" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">
	<img border="0" src="No119_2.png" width="232" height="232"><!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1托是要点。黑2做眼，白3扳，黑4只好再做眼，白5接，黑6提劫，这是双方的最佳次序。黑4如先于6位提，白5接，黑回过头来还是要走4位，现在成白先手提劫，黑弄巧成拙。</span></font><!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1时，黑2如挡，结果如何？白3当然长，黑4必扑（否则成盘角曲四），白5扳，黑6粘打，白7提劫。此变化黑如劫胜则实利稍好，不过先手劫变成了后手劫，有一利必有一弊也。</span></font>
      <p>　<!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="middle" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No119_3.png" width="232" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="middle" align="center"><!--mstheme--><font face="宋体">
      <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>
    <!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1靠就不大好。黑2遮断，白3打吃时，黑4先提劫。白非但劫败后目数损，提劫又落后手。黑4后，白如a位长，黑可置之不理。</span></font></p>
    <!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
  </tr>
</table><!--mstheme--><font face="宋体"></center>
