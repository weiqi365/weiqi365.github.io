<html>  <head> <meta http-equiv="Content-Type" content="text/html; charset=gb2312"> <meta name="GENERATOR" content="Microsoft FrontPage 6.0"> <meta name="ProgId" content="FrontPage.Editor.Document"> <title>第43型 白先劫</title> <link rel="stylesheet" type="text/css" href="../../../weiqi365.css"> <meta name="Microsoft Theme" content="-1 0111, default"> </head>  <body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体">  <h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第43型      白先劫</span></font><!--mstheme--></font></h1> <div align="center">   <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">   <tr>     <td width="33%" align="center" valign="middle"><!--mstheme--><font face="宋体"> 	<img border="0" src="No43_1.png" width="232" height="232"><!--mstheme--></font></td>     <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="33%" align="center" valign="middle"><!--mstheme--><font face="宋体"> 	<img border="0" src="No43_2.png" width="232" height="232"><!--mstheme--></font></td>   </tr>   <tr>     <td width="33%" valign="top"><!--mstheme--><font face="宋体">       <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p>       <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">黑松一口外气，净杀已经不可能了。如果白外围较强，白1、3连扳非常有力！黑4打，白5反打，在看似没有棋的地方成了劫。</span></font>       <p>　<!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="33%" valign="top"><!--mstheme--><font face="宋体">       <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p>       <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白如果1、3扳粘，黑4立。由于黑松一气，白5点、7断的手段就不成立了，黑8打，净活。白1如3位立，黑1位挡，就回到了<a href="../No8/No8.htm" target="_blank">第8型</a>。大家先不要看答案，想想结果是什么……</span></font><!--mstheme--></font></td>   </tr>   <tr>     <td width="33%" valign="middle" align="center"><!--mstheme--><font face="宋体"> 	<img border="0" src="No43_3.png" width="232" height="232"><!--mstheme--></font></td>     <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="33%" valign="middle" align="center"><!--mstheme--><font face="宋体">       <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>     <!--mstheme--></font></td>   </tr>   <tr>     <td width="33%" valign="top"><!--mstheme--><font face="宋体"><p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>       <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">这里有一个实战技巧。黑可以找机会1位扳一手，白2如应，做劫的手段自然消失了。当然好坏还要看全局情况哦。</span></font></p>     <!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="33%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>   </tr> </table><!--mstheme--><font face="宋体"></center> </div> <p align="center"> <!--webbot bot="Navigation" S-Type="arrows" S-Orientation="horizontal" S-Rendering="graphics" B-Include-Home="FALSE" B-Include-Up="TRUE" U-Page="/C:/Documents and Settings/wangxiaohui/My Documents/My Webs/Weiqi/Part1/banba/No43/No43.htm" S-Target startspan --><script language="JavaScript"><!-- MSFPhover =    (((navigator.appName == "Netscape") &&    (parseInt(navigator.appVersion) >= 3 )) ||    ((navigator.appName == "Microsoft Internet Explorer") &&    (parseInt(navigator.appVersion) >= 4 )));  function MSFPpreload(img)  {   var a=new Image(); a.src=img; return a;  } // --></script><script language="JavaScript"><!-- if(MSFPhover) { MSFPnav1n=MSFPpreload("../../../_derived/back_cmp_-1110_back.gif"); MSFPnav1h=MSFPpr
