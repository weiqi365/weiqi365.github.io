<title>第58型 白先黑死</title>

<body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体"><h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第58型    
白先黑死</span></font><!--mstheme--></font></h1>
<div align="center">
  <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">
  <tr>
    <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">
	<img border="0" src="No58_1.png" width="232" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">
	<img border="0" src="No58_2.png" width="232" height="232"><!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1点是急所。黑2如顶，白3长，充分利用了角部的特殊性。黑4贴住，白5做倒扑，黑6扳，白7扑，黑无法成两眼。黑6如于7位粘，白当然6位立。</span></font><p>　<!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1时，黑2如立，白3位并是好棋。黑4不得不粘，白5挡。以后，黑a则白b，黑b则白a，黑死。白3如急着于4位断，黑3位靠，以后白只好于b位挖，黑c打成劫，白失败。</span></font><!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="middle" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No58_3.png" width="232" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="middle" align="center"><!--mstheme--><font face="宋体">
      <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>
    <!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1立过于平庸，黑2挡成劫，白错过了一次好机会（也许这盘棋就输在这儿了？）。详见<a href="../No48/No48.htm" target="_blank">第48型</a>，在此不再敷述了。</span></font></p>
    <!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
  </tr>
</table><!--mstheme--><font face="宋体"></center>
