<body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体"><h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第120型   
白先黑死</span></font><!--mstheme--></font></h1>  
<div align="center">  
  <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">  
  <tr>  
    <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">
	<img border="0" src="No120_1.png" width="232" height="232"><!--mstheme--></font></td> 
    <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">
	<img border="0" src="No120_2.png" width="232" height="232"><!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"> 
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p> 
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1空扳是要点。黑2如粘，白3也粘，黑做不出两眼。白1如凭感觉随手于a位点，黑3位扳，是净活。</span></font><p>　<!--mstheme--></font></td> 
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"> 
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p> 
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1时，黑2如急所做眼，白有3位先冲、5位再扳的好次序，黑不行。黑a粘则白b也粘，没有接不归。</span></font><!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="middle" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No120_3.png" width="232" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="middle" align="center"><!--mstheme--><font face="宋体">
      <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>
    <!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1长，似是而非。黑2倒虎，现在成好手，白3尖时，黑4径直做眼，白5如破眼，黑6可吃白接不归，黑活。</span></font></p>
    <!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
  </tr>
