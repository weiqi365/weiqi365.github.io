<h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第28型                  
白先黑死</span></font><!--mstheme--></font></h1>
<div align="center">
  <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">
  <tr>
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No28_1.png" width="232" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No28_2.png" width="232" height="232"><!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">说穿了其实很简单，白1直接靠就行。黑2只好粘，白3扳，黑死。黑a打，白b粘，丁四！</span></font><!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1看上去厉害，其实不过是花拳绣腿。黑2一靠，白3只好挖打，黑4打成劫。黑2如走3位，白2长，黑5扑也成劫。黑2如a位粘，被白3位挤则死。（活该）</span></font><p>　<!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No28_3.png" width="232" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
      <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>
    <!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1粗看是手筋，细看却是大俗手。黑2尖顶成一眼，已立于不败之地。白3利，黑4粘，白还要a位紧气才能成双活，失败。</span></font></p>
    <!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
  </tr>
