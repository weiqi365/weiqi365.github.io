<h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第24型    
白先黑死</span></font><!--mstheme--></font></h1>
<div align="center">
  <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">
  <tr>
    <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">
	<img border="0" src="No24_1.png" width="232" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">
	<img border="0" src="No24_2.png" width="232" height="232"><!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">此型和<a href="../No4/No4.htm">第4型</a>的区别就在于立和虎。白1靠，是破眼要着。黑2粘则白3扳，黑没有足够的眼位。以后，黑a位抱吃，白b位扳。（立比虎好）</span></font><p>　<!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1扳就手软了。黑2做眼,白3打时，黑4做劫顽强。如此白失败。</span></font><!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">
	<img border="0" src="No24_3.png" width="232" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">
      <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>
    <!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1夹更不好。黑2立抵抗，白3长，黑4贴住，白5立时，黑6粘冷静。即使白a长也不过后手双活。黑6如a位挡，被白6位扑即死。（常用手筋）</span></font></p>
    <!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
  </tr>
</table><!--mstheme--><font face="宋体"></center>
