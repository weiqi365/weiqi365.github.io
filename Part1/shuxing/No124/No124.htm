<body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体"><h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第124型       
黑先活</span></font><!--mstheme--></font></h1>    
<div align="center">    
  <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">    
  <tr>    
    <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">
	<img border="0" src="No124_1.png" width="232" height="232"><!--mstheme--></font></td>    
    <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>    
    <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">
	<img border="0" src="No124_2.png" width="232" height="232"><!--mstheme--></font></td>   
  </tr>   
  <tr>   
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">   
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p>   
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">黑1倒虎是正解，如此黑活定。然而，黑</font><font face="黑体">*</font><font face="楷体_GB2312">子的作用也不可小视，是成活的条件之一。</span></font>   
      <p>　<!--mstheme--></font></td>   
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>   
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">   
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p>   
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">黑1粘不行。白2点、4断，很明显是两边不入气的形。白2如于3位扳，黑2位挡，白4位断打时，黑a位提，如此黑就活了。</span></font><!--mstheme--></font></td>   
  </tr>   
  <tr>   
    <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">
	<img border="0" src="No124_3.png" width="232" height="232"><!--mstheme--></font></td>   
    <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>   
    <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">   
      <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>   
    <!--mstheme--></font></td>   
  </tr>   
  <tr>   
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">   
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>   
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">黑1立行不行呢？白2扑好手，黑3虎为最佳应手，白4提，黑5做眼，白6扑成劫，类似的手筋以前也介绍过。黑1如于a位尖，白2仍扑，黑b做眼时，白6位扳，也是劫。</span></font></p>   
    <!--mstheme--></font></td>   
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>   
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>   
  </tr>
