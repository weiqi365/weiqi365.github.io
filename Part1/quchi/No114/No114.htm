<body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体"><h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第114型   
白先劫</span></font><!--mstheme--></font></h1>  
<div align="center">  
  <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">  
  <tr>  
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No114_1.png" width="232" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No114_2.png" width="232" height="232"><!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1的夹是正解。黑2以下至白7，成劫。此变化以前已经反复出现多次了。</span></font>
      <p>　<!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">在此，主要研究一下白1的点为什么无法净杀。黑2必挡，白3时，黑4的立是利用松一气的好手！白5、黑6后，白如a位紧气，黑b位夹就活了，所以白7尖……</span></font>
      <p>　<!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No114_3.png" width="232" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
      <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>
    <!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">黑好像不行了。黑8时，白9粘，黑10打时，白11收外气，黑12提。结果怎么样呢？白13于9位靠，成劫。（类似的形以前也出现过呢）</span></font></p>
    <!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
  </tr>
