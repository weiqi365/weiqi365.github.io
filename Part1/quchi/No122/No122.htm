<title>第122型 白先黑死</title>

<body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体"><h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第122型    
白先黑死</span></font><!--mstheme--></font></h1>   
<div align="center">   
  <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">   
  <tr>   
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No122_1.png" width="232" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No122_2.png" width="232" height="232"><!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1点是当然的急所。黑2顶，常规应法，白3长，黑4立，白5也立。接下来黑6靠求双活，然而白7扳、9挤，由于a位总归要接一手，所以黑是直三。</span></font><!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">前图的白7不能于本图1位拐，否则黑2收气，黑反而净活。此时，a位的断点就成了优点，宽出一口气来，使白b的挡不成立了。</span></font>
      <p>　<!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No122_3.png" width="232" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
      <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>
    <!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">黑1的托也挽救不了败局。白2顶，黑3挡上，白4再立到底。黑5尽量扩大眼位，同时阻白渡过，然而白6的挤仍是急所，黑7、白8交换后，黑不行。</span></font></p>
    <!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
  </tr>
</table><!--mstheme--><font face="宋体"></center>
