<title>第50型 白先黑不死</title>

<h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第50型    
白先黑不死</span></font><!--mstheme--></font></h1>
<div align="center">
  <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">
  <tr>
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No50_1.png" width="232" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No50_2.png" width="232" height="232"><!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">黑多拐一手，顿时变得很厚。白1仍然只有点，黑2在有曲的一边顶是要领！白3长，黑4立，白5也立，黑6托是手筋，白7扳，黑8粘，最终成双活。这是双方的最佳应手。白7如于8位断，黑a挡，净活！</span></font>
      <p>　<!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1、黑2时，对白3扳要千万小心！黑4曲好，以下至黑8安然净活。（别惹事哦）黑4如随手于5位挡，白4位断打，
		黑a位提，白再6位打，黑如3位粘，白b位做眼，黑是净死。（不粘是打劫）</span></font><!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No50_3.png" width="232" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
      <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>
    <!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1时，黑2顶味道不好。白3长，黑4扳，白5曲成兴师问罪之形。黑6做眼，则白7扑，黑如a位提，是二手劫。</span></font></p>
    <!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
  </tr>
</table><!--mstheme--><font face="宋体"></center>
