<h1 align="center" style="line-height: 200%"><!--mstheme--><font color="#660033"><font face="楷体_GB2312">第四部   
官子谱</font><!--mstheme--></font></h1>
<div align="center">
  <center>
  <!--mstheme--></font><table border="1" width="90%" cellpadding="7" bordercolordark="#003366" bordercolorlight="#003366">
    <tr>
      <td width="100%"><!--mstheme--><font face="宋体"><p align="left" style="line-height: 200%; margin-bottom: -16"><font size="4" face="楷体_GB2312"><b>&nbsp;&nbsp;&nbsp;       
        <font color="#0000FF">《官子谱》</font></b>最初由中国明代棋手过伯龄汇集而成。清代的陶式玉对此又重新作了编撰和修订。<b><font color="#0000FF">《陶》</font></b>本首次问世是1860年。</font></p>  
        <p align="left" style="line-height: 200%"><font face="楷体_GB2312" size="4">&nbsp;&nbsp;&nbsp;    
        所谓官子，本来是指终局时，在局部进行的比较确定的变化。但<font color="#0000FF"><b>《官子谱》</b></font>则包含了死活问题，其中大概有1500道题。如说该书把有关死活的手筋已网罗无遗，并不过份。</font></p>  
      <!--mstheme--></font></td>  
    </tr>  
  </table><!--mstheme--><font face="宋体">  
  </center>
