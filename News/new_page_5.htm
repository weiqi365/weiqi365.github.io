<html>  <head> <meta http-equiv="Content-Type" content="text/html; charset=gb2312"> <meta name="GENERATOR" content="Microsoft FrontPage 6.0"> <meta name="ProgId" content="FrontPage.Editor.Document"> <title>中国围棋棋手最新等级分排名 古力高居榜首</title> <meta name="Microsoft Theme" content="-1 0111, default"> </head>  <body background="../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体">  <p>　</p> <div align="center">   <center><!--mstheme--></font><table border="0" width="600">     <tr>       <td><!--mstheme--><font face="宋体"><p align="center"><b>中国围棋棋手最新等级分排名 古力高居榜首</b></p>         <p>　<!--mstheme--></font></td>     </tr>     <tr>       <td><!--mstheme--><font face="宋体"><span class="news-content"> 		　　据新华社北京5月19日电 中国棋院19日公布了中国围棋职业棋手最新等级分排名，古力继续高居榜首，孔杰、周鹤洋分列第二、三位。</span><p> 		<span class="news-content"> 		　　以下是排名前10位的棋手及其等级分：1、古力（2769分）；2、孔杰（2705分）；3、周鹤洋（2684分）；4、王磊（2669分）；5、胡耀宇（2666分）；6、俞斌（2656分）；7、常昊（2633分）；8、邱峻（2631分）；9、谢赫（2621分）；10、王檄（2617分）。</span><!--mstheme--></font></td>       </tr>    </table><!--mstheme--><font face="宋体"></center>  </div>    <p>　</p>   <!--mstheme--></font></body>    </html>
