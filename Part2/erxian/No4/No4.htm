<title>第4型 黑先活</title>

<body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体">

<h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第4型   
黑先活</span></font><!--mstheme--></font></h1>     
<div align="center">     
  <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">     
  <tr>     
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No4_1.png" width="252" height="232"><!--mstheme--></font></td> 
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No4_2.png" width="252" height="232"><!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"> 
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p> 
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">黑1立好。白2扳则黑3挡，按双方互立计算目数的话，黑有五目空。当然，黑走1位立还是2位立，要看当时的情况。</span></font> 
      <p>　<!--mstheme--></font></td> 
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"> 
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p> 
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">黑1立中间怎么样？以下，白a则黑b，白c则黑d，活棋是没有问题的。然而，如此则损了一目，不能算正解。</span></font><!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No4_3.png" width="252" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
      <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>
    <!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">此形，白先则黑死。白1以下至白5，黑成直三。这就是棋谚“七死八活”中的“七死”。</span></font></p>
    <!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">　
      <p><font face="楷体_GB2312" color="#FF0000"><span style="letter-spacing: 1pt">结论：白先黑死，黑先则活。</span></font><!--mstheme--></font></td>
  </tr>
</table><!--mstheme--><font face="宋体"></center>
</div>
