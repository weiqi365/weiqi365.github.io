<h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第61型    
白先黑死</span></font><!--mstheme--></font></h1>       
<div align="center">       
  <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">       
  <tr>       
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No61_1.png" width="252" height="232"><!--mstheme--></font></td> 
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No61_2.png" width="252" height="232"><!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"> 
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p> 
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1扳，平凡的好手。从有曲的这边扳，是一般常识。黑2如尖，白3爬，黑做不出两眼。黑2如于3位挡，白当然于2位点。</span></font><p>　<!--mstheme--></font></td> 
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"> 
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p> 
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1点，往往是第一感觉，然而切不可随手。黑2尖顶，白3只好长，黑4立，白5曲，才混了个后手双活，大失败。黑2是急所，如于a位立，被白4位扳，乃自取其败。</span></font><!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No61_3.png" width="252" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
      <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>
    <!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1透点，很是凶狠！然而，黑形毫无缺陷，可保无恙。黑2尖顶，先占急所，白3如退，黑4做眼，已活。白1如于3位单扳，黑仍应在2位，道理是一样的。</span></font></p>
    <!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p>　
      <p>　<!--mstheme--></font></td>
  </tr>
</table><!--mstheme--><font face="宋体"></center>
