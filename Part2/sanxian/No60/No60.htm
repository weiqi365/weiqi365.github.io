<title>第60型 白先黑不死</title>

<h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第60型     
白先黑不死</span></font><!--mstheme--></font></h1>        
<div align="center">        
  <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">        
  <tr>        
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No60_1.png" width="252" height="232"><!--mstheme--></font></td> 
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No60_2.png" width="252" height="232"><!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"> 
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p> 
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">黑要小心应对。白1挡，黑2虎，只此一手！白3点，再次考验，黑4从上边虎住，方保平安。黑4如于a位挡，白b扑，黑只好于4位打，让白c位先手拔二子，后手d位提活棋，大损。黑2如于a位跳补，白b位断打，黑c、白3、黑2、白e位断，黑全死！</span></font> 
      <p>　<!--mstheme--></font></td> 
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"> 
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p> 
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1挡时，黑2如粘，味大恶。白3点，正中急所，黑4只好靠，白5、黑6、白7，成劫。黑4如于5位虎，白4位爬，黑净死。</span></font><p>　<!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No60_3.png" width="252" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
      <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>
    <!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1如从里面点，黑2仍然虎顶。白3爬，黑4再顶，如此可保城池不失。这就是这种形状的要点，板八要比板六复杂得多啊！此形实战中常见，望牢记之。</span></font></p>
    <!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
  </tr>
</table><!--mstheme--><font face="宋体"></center>
