<h1 align="center"><!--mstheme--><font color="#660033"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">第2型   
白先黑不死</span></font><!--mstheme--></font></h1>     
<div align="center">     
  <center><!--mstheme--></font><table border="0" width="800" cellspacing="5">     
  <tr>     
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No2_1.png" width="252" height="232"><!--mstheme--></font></td> 
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No2_2.png" width="252" height="232"><!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"> 
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图1</span></font></p> 
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">这是典型的活形，叫做“板六”。白1如靠，黑2夹，以后白a则黑b，白b则黑a，黑死活无忧。黑的死活和外气无关。</span></font><!--mstheme--></font></td> 
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td> 
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"> 
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图2</span></font></p> 
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">白1如在下边点，则黑2顶住，白无手段。黑2如脱先，被白2位长，顿死。</span></font> 
      <p>　<!--mstheme--></font></td> 
  </tr> 
  <tr> 
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
	<img border="0" src="No2_3.png" width="252" height="232"><!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" align="center"><!--mstheme--><font face="宋体">
      <h1><!--mstheme--><font color="#660033"><span style="letter-spacing: 1pt"><a href="mailto:fiveduan@tom.com"><font face="楷体_GB2312">您的高见</font></a></span><!--mstheme--></font></h1>
    <!--mstheme--></font></td>
  </tr>
  <tr>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体">
      <p align="center"><font face="楷体_GB2312"><span style="letter-spacing: 1pt">图3</span></font></p>
      <p><font face="楷体_GB2312"><span style="letter-spacing: 1pt">再来看看其变化形。现在a位有断点，对死活有影响吗？白如b则黑c，白如c则黑b，仍然是净活。（真的很坚固哦）</span></font></p>
    <!--mstheme--></font></td>
    <td width="10%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
    <td width="45%" valign="top"><!--mstheme--><font face="宋体"><!--mstheme--></font></td>
  </tr>
